}

/* ============ ВИТРИНЫ: ОЛИГАРХ / ПРЕСТИЖ / ЗНАМЕНИТОСТЬ ============
   Пятьдесят предметов в каждой, покупаются один раз за монеты.
   Каждый купленный навсегда добавляет очки в лигу. */
const TIER_NAME = ['Олигарх','Престиж','Знаменитость'];
const TIER_FRAME = ['чёрная рамка','золотая рамка','бриллиантовая рамка'];
// Римская запись круга: I, II, III, IV, ... без потолка
function roman(n){
  const T = [[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],
             [10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
  let out = '';
  for(const [v,c] of T) while(n >= v){ out += c; n -= v; }
  return out;
}
const cycleName = (t, cyc) => TIER_NAME[t] + (cyc > 1 ? ' ' + roman(cyc) : '');
const cyclePriceMult = cyc => Math.pow(C.CYCLE_PRICE_MULT, cyc-1);
const cyclePtsMult   = cyc => Math.pow(C.CYCLE_PTS_MULT,   cyc-1);
const vipLvl = i => clamp((i+1)*2, 1, C.CHAIN_LEN);
function vipPrice(i,t,cyc){
  const [lo,hi] = C.VIP_RANGE[t];
  return Math.round(lo * cyclePriceMult(cyc || S.cycle) * Math.pow(hi/lo, i/(C.VIP_COUNT-1)));
}
const vipPts = (i,t,cyc) => C.VIP_PTS_STEP * (i+1) * C.VIP_TIER_PTS[t] * cyclePtsMult(cyc || S.cycle);
const vipOwned = (i,t) => S.vip[t].indexOf(i) >= 0;
const vipDone  = t => S.vip[t].length >= C.VIP_COUNT;
const tierOpen = t => t === 0 || vipDone(t-1);
const cyclePtsTotal = cyc => C.VIP_PTS_STEP * (C.VIP_COUNT*(C.VIP_COUNT+1)/2) *
  C.VIP_TIER_PTS.reduce((a,b)=>a+b,0) * cyclePtsMult(cyc);
function leagueMax(){
  let n = 0;
  for(let c=1;c<=C.LEAGUE_TOP_CYCLE;c++) n += cyclePtsTotal(c);
  return Math.round(n);
}
function vipBonus(){
  let n = S.ptsBank;
  for(let t=0;t<3;t++) for(const i of S.vip[t]) n += vipPts(i,t);
  return Math.round(n);
}
function vipBuy(i,t){
  if(!tierOpen(t) || vipOwned(i,t)) return;
  const p = vipPrice(i,t);
  if(S.coins < p){ toast('Не хватает ' + fmt(p - S.coins) + ' 🪙'); SFX.err(); haptic('err'); return; }
  S.coins -= p;
  const wasMin = genMin();
  S.vip[t].push(i);
  /* Каждый выкупленный предмет: алмазы, плюс к баку и шаг к росту сброса.
     Бак и сброс считаются от числа выкупленного, отдельных полей не заводим. */
  earnGems(C.VIP_GEMS);
  SFX.coin(); haptic('ok');
  toast(nameOf(vipLvl(i)) + ' в состоянии · +' + fmt(vipPts(i,t)) + ' очков · +' +
    C.VIP_GEMS + ' 💎 · +' + C.VIP_ENERGY + ' ⚡ к баку');
  const nowMin = genMin();
  if(nowMin > wasMin){
    SFX.level(); haptic('ok');
    openSheet('<div class="bigem">' + emo(nowMin) + '</div>' +
      '<h3 class="sh-h">Банкомат подрос</h3>' +
      '<p class="sh-p">Теперь он сбрасывает не ниже, чем <b style="color:var(' + RAR_VAR[rarOf(nowMin)] + ')">' +
        nameOf(nowMin) + '</b> вместо ' + nameOf(wasMin) + '. Выкуплено предметов витрин: ' + vipCount() + '.</p>' +
      '<div class="sh-row"><button class="btn gr" data-act="close">Отлично</button></div>');
  }
  if(vipDone(t) && t < 2){
    SFX.level();
    openSheet('<div class="bigem">' + ['👑','💠'][t] + '</div>' +
      '<h3 class="sh-h">Открыт ' + cycleName(t+1, S.cycle) + '</h3>' +
      '<p class="sh-p">Витрина «' + cycleName(t, S.cycle) + '» собрана целиком. Следующая дороже, ' +
        TIER_FRAME[t+1] + ' и даёт втрое больше очков за предмет.</p>' +
      '<div class="sh-row"><button class="btn gold" data-act="close">Погнали</button></div>');
  }
  if(vipDone(2)) nextCycle();
  renderAll(); save();
}
// Вся Знаменитость выкуплена — начинается следующий круг: витрины пустеют,
// цены и очки растут, набранные очки уходят в банк и остаются навсегда.
function nextCycle(){
  const closed = S.cycle;
  S.ptsBank += Math.round(cyclePtsTotal(closed));
  S.cycle++;
  // витрины пустеют, но выкупленное запоминаем: бак и сброс от него не должны откатываться
  S.vipEver = (S.vipEver|0) + S.vip.reduce((n,a)=>n + (a ? a.length : 0), 0);
  S.vip = [[],[],[]];
  SFX.level(); haptic('ok');
  setTimeout(()=>openSheet('<div class="bigem">♻️</div>' +
    '<h3 class="sh-h">Круг ' + roman(closed) + ' закрыт</h3>' +
    '<p class="sh-p">Все три витрины выкуплены. Открывается <b style="color:var(--gold)">' +
      cycleName(0, S.cycle) + '</b>: цены выше в ' + fmt(C.CYCLE_PRICE_MULT) +
      ' раз, очки за предмет — втрое.<br>Заработанные ' + fmt(S.ptsBank) + ' очков остаются навсегда.</p>' +
    '<div class="sh-row"><button class="btn gold" data-act="close">Дальше</button></div>'), 300);
}

/* ============ ЛИГА ============ */
// Очки лиги теперь дают ТОЛЬКО витрины. Никаких очков за слияния и заказы.
function leaguePts(){ return vipBonus(); }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/* Ники в духе тех, что реально встречаются в играх: латиница, кириллица,
   цифры, украшения. Собираются из частей по детерминированному сиду. */
const NICK_CORE = ['Shadow','Killer','Dragon','Sniper','Nagibator','Legenda','Xzibit','Dark','Ghost','Viper',
 'Kripta','Baron','Loki','Kraken','Zeus','Nikita','Sanya','Vovan','Tolyan','Кисуля','Барсик','Хомяк','Мажор',
 'Vasya','Petrovich','Boss','Money','Cash','Trader','Broker','Pixel','Neon','Turbo','Rocket','Wolf','Bear',
 'Panda','Tiger','Fox','Ниндзя','Батя','Дядя','Тётя','Пельмень','Котлета','Сырок','Борщ','Бобёр','Ёжик','Крот']
const NICK_PRE  = ['','','','xX_','_','pro','MR_','THE_','iam','Just','Real','Not','Ultra','Mega','Super','Old','New'];
const NICK_POST = ['','','','_Xx','_pro','228','777','2007','2010','_off','_ttv','1337','_yt','__','_TG','99','01','13','_ru'];
function nickFor(i, r){
  const core = NICK_CORE[Math.floor(r()*NICK_CORE.length)];
  const pre  = NICK_PRE[Math.floor(r()*NICK_PRE.length)];
  const post = NICK_POST[Math.floor(r()*NICK_POST.length)];
  let n = pre + core + post;
  if(n.length < 4) n += Math.floor(r()*900+100);
  return n;
}
function startOfWeek(){ const d = new Date(); const dd = (d.getDay()||7)-1; d.setHours(0,0,0,0); d.setDate(d.getDate()-dd); return d.getTime(); }
function endOfWeek(){ return startOfWeek() + 7*86400000; }
function leaderboard(){
  const my = leaguePts(), di = divIndex(my), d = divisions()[di];
  const r = mulberry(weekKey()*7919 + (S.league.seed|0) + di*131);
  const rows = [];
  // Соперники — только из твоего дивизиона: он и есть лига, за места в ней платят
  for(let i=0;i<C.LEAGUE_SIZE-1;i++){
    // Равномерно по диапазону дивизиона: место растёт линейно вместе с тем,
    // сколько витрины ты выкупил внутри своей лиги
    const span = d[2] - d[1];
    rows.push({ name: nickFor(i, r), pts: Math.round(d[1] + r() * span), me:false });
  }
  rows.push({ name:(tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || 'Ты',
              pts: my, me:true });
  rows.sort((a,b)=>b.pts-a.pts);
  return rows;
}
/* Дивизионы — доли от текущего потолка лиги, а не жёсткие числа.
   Потолок = очки за все круги до LEAGUE_TOP_CYCLE, то есть по лидеру игры. */
const DIV_NAMES = ['Бронза','Серебро','Золото','Платина','Алмаз','Легенда'];
function divisions(){
  const max = leagueMax();
  return DIV_NAMES.map((n,i)=>[ n, Math.round(max * C.DIV_FRAC[i]),
    i < DIV_NAMES.length-1 ? Math.round(max * C.DIV_FRAC[i+1]) : max + 1 ]);
}
function divIndex(p){
  const D = divisions();
  let k = 0;
  for(let i=0;i<D.length;i++) if(p >= D[i][1]) k = i;
  return k;
}
function divisionOf(p){ return divisions()[divIndex(p)]; }
const prizeFor = (rank, dIdx) => rank < C.LEAGUE_PRIZES.length

/* ============ ПОСЫЛКИ (награды вдвое щедрее прежних) ============ */
function rollRarity(){
  S.pulls++;
  if(S.pity + 1 >= C.PITY_PULLS){ S.pity = 0; return rndInt(2,4); }
  const r = Math.random(); let acc = 0;
  for(let i=0;i<C.ODDS.length;i++){ acc += C.ODDS[i]; if(r < acc){ if(i >= 2) S.pity = 0; else S.pity++; return i; } }
  S.pity++; return 0;
}
function chestReward(rar){
  // Предмет обязан быть ТОЙ ЖЕ редкости, что показана на посылке: берём уровень
  // строго из полосы этой редкости. Полоса ограничена прогрессом (seen + 2).
  const lo = rar*RAR_BAND + 1;
  const hi = Math.min((rar+1)*RAR_BAND, S.seen + 2);
  const canItem = hi >= lo;
  if(rar === 0){
    if(canItem && Math.random() < .5) return { kind:'item', l:rndInt(Math.max(lo,hi-4), hi), rar };
    return { kind:'coins', n:pctCoins(C.CHEST_COIN_PCT[0], 800), rar };
  }
  if(rar === 1 && !canItem && Math.random() < .45) return { kind:'coins', n:pctCoins(C.CHEST_COIN_PCT[1], 3000), rar };
  if(rar === 1 && canItem && Math.random() < .2)  return { kind:'coins', n:pctCoins(C.CHEST_COIN_PCT[1], 3000), rar };
  if(rar === 3 && Math.random() < .2) return { kind:'boost', rar };
  if(canItem && Math.random() < .65) return { kind:'item', l:rndInt(Math.max(lo,hi-4), hi), rar };
  // Полоса ещё не открыта прогрессом — вместо предмета алмазы по классу посылки
  const g = C.CHEST_GEMS[rar];
  return { kind:'gems', n:rndInt(g[0], g[1]), rar, locked: !canItem };
}
function applyReward(rw){
  if(rw.kind === 'coins') gainCoins(rw.n);
  if(rw.kind === 'gems')  S.gems  += rw.n;
  if(rw.kind === 'boost') S.drop2Until = Math.max(S.drop2Until, Date.now()) + C.BOOST_DROP2_MIN*60000;
  if(rw.kind === 'item'){
    if(countFree() <= 0){ rw.sold = price(rw.l); gainCoins(rw.sold); }
    else spawn(rw.l);
  }
}
function rewardLine(rar, rw){
  const col = 'var(' + RAR_VAR[rar] + ')';
  let ic = '🪙', tx = '';
  if(rw.kind === 'coins'){ ic = '🪙'; tx = '+' + fmt(rw.n) + ' монет'; }
  if(rw.kind === 'gems'){  ic = '💎'; tx = '+' + rw.n + ' алмазов' + (rw.locked ? ' · предметы этой редкости ещё не открыты' : ''); }
  if(rw.kind === 'boost'){ ic = '🤑'; tx = 'Банкомат сошёл с ума, ' + C.BOOST_DROP2_MIN + ' мин'; }
  if(rw.kind === 'item'){  ic = emo(rw.l); tx = nameOf(rw.l) + ' · ур. ' + rw.l + (rw.sold ? ' → продан за ' + fmt(rw.sold) : ''); }
  return '<div class="lootrow" style="--lc:' + col + '">' +
    '<span class="li">' + ic + '</span><span class="lt">' + tx + '</span>' +
    '<span class="lr">' + RARITY[rar] + '</span></div>';
}
/* src — откуда посылка:
     'coins' куплена за монеты — берётся бесконечно, пока хватает кошелька,
             поэтому алмазы режем до CHEST_COIN_GEM_MAX;
     'item'  добыта с заряженного предмета — их тоже много,
             алмазы делим на CHEST_ITEM_GEM_DIV;
     иначе   посылка за задания, уровни и покупки — награда как есть. */
function openChests(n, src){
  const got = []; let best = 0;
  for(let i=0;i<n;i++){
    const rar = rollRarity();
    let rw = chestReward(rar);
    // Обычная посылка за монеты платит алмазами, а не монетами: покупать её
    // за монеты ради монет бессмысленно. Предмет, если он выпал, остаётся.
    if(src === 'coins' && rw.kind === 'coins' && rar === 0)
      rw = { kind:'gems', n:C.CHEST_COIN_GEMS[0], rar };
    if(rw.kind === 'gems'){
      // за монеты алмазы фиксированные по редкости, а не доля от щедрой общей таблицы
      if(src === 'coins') rw.n = Math.min(C.CHEST_COIN_GEMS[rar], C.CHEST_COIN_GEM_MAX);
      if(src === 'item')  rw.n = Math.max(1, Math.round(rw.n / C.CHEST_ITEM_GEM_DIV));
    }
    applyReward(rw); got.push({rar,rw});
    if(rar > best) best = rar;
  }
  SFX.chest(best); haptic(best >= 2 ? 'ok' : 'light');
  const head = n === 1
    ? '<div class="bigem">' + (got[0].rw.kind === 'item' ? emo(got[0].rw.l) : '📦') + '</div>' +
      '<h3 class="sh-h" style="color:var(' + RAR_VAR[got[0].rar] + ')">' + RARITY[got[0].rar] + '</h3>'
    : '<div class="bigem">🚚</div><h3 class="sh-h">Вскрыл ' + n + ' посылок</h3>';
  openSheet(head + '<div class="loot">' + got.map(g=>rewardLine(g.rar,g.rw)).join('') + '</div>' +
    '<p class="sh-p" style="margin:8px 0 0">До жирного улова: ' + (C.PITY_PULLS - S.pity) + '</p>' +
    '<div class="sh-row"><button class="btn gr" data-act="close">В карман</button></div>');
  renderAll(); save();
}

function makeOffer(){
  const busy = S.offers.map(o=>o.k);
  const free = OFFER_POOL.filter(o=>busy.indexOf(o.k) < 0);
  if(!free.length) return null;
  const tpl = pick(free);
  return { k:tpl.k, until: Date.now() + tpl.min*60000 };
}
function addOffer(){
  if(S.offers.length >= C.OFFER_MAX) return false;
  const o = makeOffer();
  if(!o) return false;
  S.offers.push(o);
  renderAlerts();
  return true;
}
// Чистим просроченные и подсыпаем новые по таймеру
function tickOffers(){
  const n = S.offers.length;
  S.offers = S.offers.filter(o=>o.until > Date.now());
  let changed = n !== S.offers.length;
  if(Date.now() >= (S.offerNextAt||0)){
    S.offerNextAt = Date.now() + C.OFFER_EVERY_MIN*60000;
    if(addOffer()) changed = true;
  }
  return changed;
}
function offerBuy(i){
  const o = S.offers[i];
  if(!o) return;
  const tpl = OFFER_POOL.find(x=>x.k === o.k);
  if(!tpl) { S.offers.splice(i,1); return; }
  if(!spendGems(tpl.dyn ? tpl.dyn() : tpl.gems)) return;
  const g = tpl.give;
  let chests = 0;
  if(g.en){ if(S.energy >= energyMax()) S.enTs = Date.now(); S.energy += Math.round(energyMax()*g.en); }
  if(g.co){ gainCoins(pctCoins(g.co, 2000)); }
  if(g.mg){ S.magnets = (S.magnets|0) + g.mg; }
  if(g.bo){ S.drop2Until = Math.max(S.drop2Until, Date.now()) + g.bo*60000; }
  if(g.prem){ S.premiumUntil = Math.max(S.premiumUntil, Date.now()) + g.prem*86400000; fillOrders(); }
  if(g.ch){ chests = g.ch; }
  S.offers.splice(i,1);
  SFX.coin(); haptic('ok');
  toast(tpl.t + ' — забрал');
  if(chests) openChests(chests); else { renderAll(); save(); }
}

/* ============ ПАКЕТЫ МОНЕТ ============
   Дают долю от того, что уже накоплено, поэтому не обесцениваются
   с ростом экономики. Каждый — раз в час. */
function coinPackAmount(id){
  const c = Math.max(0, S.coins);
  if(id === 'coins_1') return Math.max(C.COINS_1_MIN, Math.round(c * C.COINS_1_MULT));
  return Math.max(C.COINS_2_MIN, Math.round(c * C.COINS_2_MULT));
}
const coinCdLeft = id => Math.max(0, (S.coinCd && S.coinCd[id] || 0) - Date.now());
// Доля от текущего баланса, но не меньше нижнего порога
/* Потолок кошелька: десять самых жирных заказов, но не ниже COIN_CAP_MIN.
   Растёт только от заказов — чем дороже сданный заказ, тем выше планка. */
const coinCap = () => Math.round(
  Math.max(C.COIN_CAP_MIN, (S.bestOrder||0) * C.COIN_CAP_MULT) * Math.max(1, S.capMul||1));
// Докупки потолка живут в том же часе, что и задания, и обнуляются вместе с ним
function capHourSync(){
  if(S.capHour !== hourKey()){ S.capHour = hourKey(); S.capCoinUsed = 0; S.capGemUsed = 0; }
}
const capCoinLeft = () => { capHourSync(); return Math.max(0, C.CAP_COIN_PER_HOUR - S.capCoinUsed); };
const capGemLeft  = () => { capHourSync(); return Math.max(0, C.CAP_GEM_PER_HOUR  - S.capGemUsed);  };
// Единственная дверь для прихода монет: всё, что сверх потолка, сгорает
function gainCoins(n){
  n = Math.max(0, Math.round(n));
  const cap = coinCap();
  const room = Math.max(0, cap - S.coins);
  const got = Math.min(n, room);
  S.coins += got;
  return got;
}
const pctCoins = (mult, min) => Math.max(min, Math.round(Math.max(0,S.coins) * mult));
const chestCoinPrice = () => pctCoins(C.CHEST_PRICE_PCT, C.CHEST_COIN_PRICE);
/* Посылок за монеты — не больше CHEST_COIN_PER_HOUR в час. Счётчик привязан
   к тому же часу, что и задания, и обнуляется сам при смене часа. */
function chestCoinLeft(){
  if(S.chestHour !== hourKey()) return C.CHEST_COIN_PER_HOUR;
  return Math.max(0, C.CHEST_COIN_PER_HOUR - (S.chestUsed|0));
}

const weekendCoins = () => pctCoins(C.OFFER_WEEKEND_PCT, 40000);

/* ============ ПОКУПКА ЗА АЛМАЗЫ ============ */
function gemBuy(id){
  const g = GOODS[id];
  if(!g) return;
  // Кулдаун проверяем ДО списания алмазов, иначе они сгорели бы впустую
  if(id === 'coins_1' || id === 'coins_2'){
    const left = coinCdLeft(id);
    if(left > 0){ toast(g.title + ': ещё ' + mmss(left)); SFX.err(); haptic('err'); return; }
  }
  if(!spendGems(goodPrice(id))) return;
  SFX.coin();
  switch(id){
    case 'energy_full': S.energy = energyMax(); S.enTs = Date.now(); toast('Бак полный'); break;
    case 'energy_30':   if(S.energy >= energyMax()) S.enTs = Date.now(); S.energy += canEnergy(); toast('+' + canEnergy() + ' ⚡'); break;
    case 'boost_drop2': S.drop2Until = Math.max(S.drop2Until, Date.now()) + C.BOOST_DROP2_MIN*60000; toast('Банкомат сошёл с ума'); break;
    case 'coins_1': case 'coins_2': {
      let n = coinPackAmount(id);
      n = gainCoins(n); quest('coins', n);
      S.coinCd[id] = Date.now() + C.COIN_BUY_CD_MIN*60000;
      toast('+' + fmt(n) + ' 🪙');
      break;
    }
    case 'magnets_10':  S.magnets = (S.magnets|0) + C.MAGNET_PACK; toast('Магнитов: ' + S.magnets); break;
    case 'chest_1':     openChests(1); return;
    case 'chest_10':    openChests(10); return;
    case 'premium_week':
      S.premiumUntil = Math.max(S.premiumUntil, Date.now()) + C.PREM_DAYS*86400000;
      S.enTs = Date.now(); fillOrders(); toast('Золотая карта в кармане'); break;
    case 'offer_starter':
      S.energy += starterEnergy(); gainCoins(starterCoins());
      S.drop2Until = Math.max(S.drop2Until, Date.now()) + C.BOOST_DROP2_MIN*60000;
      S.starterDone = true; toast('Подъёмные получены'); break;
    case 'offer_rescue':
      if(S.rescueTarget){ spawn(S.rescueTarget); S.rescueTarget = null; toast('Вещь на поле'); }
      break;
    case 'offer_weekend':
      S.energy = energyMax(); gainCoins(weekendCoins()); S.weekendWeek = weekKey();
      toast('Загул оплачен'); openChests(3); return;
  }
  renderAll(); save();
}

/* ============ СБРОС ПРОГРЕССА (кнопка на экране Лиги) ============ */
async function wipeSave(){
  const ok = await ask('Начать заново?',
    'Сотрутся уровень, алмазы, монеты, поле, задания и место в лиге.\nВернуть будет нельзя.',
    'Стереть');
  if(!ok) return;
  clearTimeout(saveT);
  try{ localStorage.removeItem(C.SAVE_KEY); }catch(e){}
  try{ if(tg && tg.CloudStorage) tg.CloudStorage.removeItem(C.SAVE_KEY, ()=>{}); }catch(e){}
  S = fresh();
  S.day = '';                    // чтобы заново раскатились задания и бесплатные смены
  rollDay();
  S.league.week = weekKey();
  S.rows = rowsMax();
  fillOrders();
  S.tut = true;                  // поле остаётся пустым: начинаем с нуля, как просили
  buildBoard();                  // перестраиваем клетки, чтобы не остались старые предметы
  go('game');
  toast('Начали заново');
  SFX.level(); haptic('ok');
  save();
}

    + (S.energy < em ? ' · ' + mmss(regenSec()*1000 - (Date.now()-S.enTs)) : '');

  bm.classList.toggle('cooling', !charged && cd > 0);

  bm.querySelector('.t').textContent = charged ? 'МАГНИТ'
    : (cd > 0 ? mmss(cd) : (S.mergeStreak|0) + '/' + C.MAGNET_PER_MERGES);

let built = false;
function sizeBoard(){
  const wrap = $('#boardWrap'), b = $('#board');
  if(!wrap || !b || wrap.clientHeight < 60) return;
  const gap = 5;
  const w = wrap.clientWidth - 20, h = wrap.clientHeight - 4;
  const cell = Math.max(30, Math.floor(Math.min(
    (w - gap*(C.BOARD_COLS-1)) / C.BOARD_COLS,
    (h - gap*(C.BOARD_ROWS-1)) / C.BOARD_ROWS)));
  b.style.setProperty('--cell', cell + 'px');
}
function buildBoard(){
  const b = $('#board'); b.innerHTML = '';
  for(let i=0;i<CELLS;i++){
    const c = document.createElement('div');
    c.className = 'cell'; c.dataset.i = i;
    b.appendChild(c);
  }
  built = true; sizeBoard();
}
window.addEventListener('resize', sizeBoard);
if(window.visualViewport) window.visualViewport.addEventListener('resize', sizeBoard);
/* Оттенок подсветки по уровню. Шаг 47° по кругу — соседние уровни
   всегда заметно разного цвета, а через 20 уровней цвет не повторяется подряд. */
function lvlHue(l){ return 'hsl(' + ((l * 47) % 360) + ' 72% 60%)'; }
/* Фон карточки в том же оттенке, но тёмный — предметы соседних уровней
   различаются цветом подложки, даже если значки почти одинаковые. */
function lvlBg(l){
  const h = (l * 47) % 360;
  return '--b1:hsl(' + h + ' 26% 22%);--b2:hsl(' + h + ' 30% 13%);';
}
function renderBoard(){
  if(!built) buildBoard();
  const cells = $('#board').children;
  for(let i=0;i<CELLS;i++){
    const cell = cells[i];
    cell.classList.toggle('locked', !cellOpen(i));
    const it = S.board[i], cur = cell.firstChild;
    if(!it){ if(cur) cell.innerHTML = ''; continue; }
    const rar = rarOf(it.l);
    const sig = it.l + ':' + (it.ch == null ? '-' : it.ch) + ':' + (it.sp == null ? '-' : it.sp)
      + ':' + (it.vault == null ? '-' : 'v' + it.vault);
    if(cur && cur.dataset && cur.dataset.sig === sig) continue;
    if(it.vault != null){
      cell.innerHTML = '<div class="item vault" data-sig="' + sig + '" style="--rc:var(' +
        RAR_VAR[it.vault] + ')"><span class="em">🔐</span>' +
        '<span class="lv">' + RARITY[it.vault][0] + '</span></div>';
      continue;
    }
    const sp = specialOf(it), gx = galaxyOf(it.l);
    cell.innerHTML = '<div class="item r' + (rar+1) + (sp ? ' special' : '') + (gx > 1 ? ' galaxy' : '') + '" data-sig="' + sig +
      '" style="--rc:var(' + RAR_VAR[rar] + ');--lc:' + lvlHue(it.l) + ';' + lvlBg(it.l) + '">' +
      '<span class="em">' + emo(it.l) + '</span><span class="lv">' + it.l + '</span>' +
      (sp ? '<span class="sp">' + sp.ic + '</span>' : '') +
      (gx > 1 ? '<span class="gx">' + roman(gx) + '</span>' : '') +
      (it.ch != null ? '<span class="ch">' + it.ch + '</span>' : '') + '</div>';
  }
}

function renderTiers(){
  const rom = S.cycle > 1 ? ' ' + roman(S.cycle) : '';
  const short = ['ОЛИГАРХ','ПРЕСТИЖ','ЗВЕЗДА'];
  for(let t=0;t<3;t++){
    const btn = document.querySelector('.tier[data-tier="' + t + '"]');
    btn.querySelector('.tn').textContent = short[t] + rom;
    const open = tierOpen(t);
    btn.disabled = !open;
    // Красная точка — когда монет хватает хотя бы на один невыкупленный предмет
    let can = false;
    if(open) for(let i=0;i<C.VIP_COUNT;i++) if(!vipOwned(i,t) && S.coins >= vipPrice(i,t)){ can = true; break; }
    btn.classList.toggle('alert', can);
    let lock = btn.querySelector('.lock');
    if(!open && !lock){ lock = document.createElement('span'); lock.className = 'lock'; lock.textContent = '🔒'; btn.appendChild(lock); }
    if(open && lock) lock.remove();
  }
}

let drag = null;
const ghost = $('#ghost');
function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  const c = el && el.closest ? el.closest('.cell') : null;
  return c ? +c.dataset.i : -1;
}
$('#board').addEventListener('pointerdown', e=>{
  const cell = e.target.closest('.cell'); if(!cell) return;
  const i = +cell.dataset.i;
  if(!S.board[i] || !cellOpen(i)) return;
  drag = { i, x:e.clientX, y:e.clientY, moved:false };
  try{ $('#board').setPointerCapture(e.pointerId); }catch(err){}
});
$('#board').addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 7) return;
  if(!drag.moved){
    drag.moved = true;
    const src = document.querySelector('.cell[data-i="'+drag.i+'"] .item');
    if(src){
      ghost.innerHTML = src.outerHTML;
      const r = src.getBoundingClientRect(), g = ghost.firstChild;
      g.style.width = r.width+'px'; g.style.height = r.height+'px';
      ghost.style.display = 'block'; src.classList.add('dragging');
    }
  }
  ghost.style.left = e.clientX+'px'; ghost.style.top = (e.clientY-26)+'px';
  const over = cellAt(e.clientX, e.clientY-26);
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  if(over >= 0 && over !== drag.i && cellOpen(over))
    document.querySelector('.cell[data-i="'+over+'"]').classList.add('over');
});
$('#board').addEventListener('pointerup', e=>{
  if(!drag) return;
  const d = drag; drag = null;
  ghost.style.display = 'none'; ghost.innerHTML = '';
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  const src = document.querySelector('.cell[data-i="'+d.i+'"] .item');
  if(src) src.classList.remove('dragging');
  if(!d.moved){ tapCell(d.i); return; }
  const to = cellAt(e.clientX, e.clientY-26);
  if(to < 0 || to === d.i || !cellOpen(to)){ renderBoard(); return; }
  if(!tryMerge(d.i,to)){
    const t = S.board[to]; S.board[to] = S.board[d.i]; S.board[d.i] = t;
    renderAll(); save();
  }
});
$('#board').addEventListener('pointercancel', ()=>{
  drag = null; ghost.style.display = 'none';
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  renderBoard();
});
function tapCell(i){
  const it = S.board[i]; if(!it) return;
  if(it.vault != null){ openVault(i); return; }
  const sp = specialOf(it);
  if(sp && it.ch != null && it.ch > 0){
    if(sp.type === 'producer'){
      if(countFree() <= 0){ toast('Класть некуда'); SFX.err(); haptic('err'); return; }
      const ni = spawn(Math.max(1, it.l - C.PRODUCER_BACK));
      if(ni >= 0) popCell(ni);
      SFX.tap();
    } else if(sp.type === 'safe'){
      let n = price(it.l) * C.SAFE_MULT;
      n = gainCoins(n); quest('coins', n);
      toast('Касса: +' + fmt(n) + ' 🪙'); SFX.coin();
    } else if(sp.type === 'energy'){
      if(S.energy >= energyMax()) S.enTs = Date.now();
      S.energy += specialEnergy();
      toast('Генератор: +' + specialEnergy() + ' ⚡'); SFX.gem();
    } else if(sp.type === 'gems'){
      earnGems(C.SPECIAL_GEMS);
      toast('Копилка: +' + C.SPECIAL_GEMS + ' 💎'); SFX.gem();
    } else if(sp.type === 'chest'){
      S.itemChests++;
      toast('Посылка с предмета, вскрой во вкладке'); SFX.gem();
    }
    it.ch--;
    if(it.ch <= 0) S.board[i] = null;
    haptic('light');
    renderAll(); save(); return;
  }
  itemSheet(i);
}

    case 'daily': claimDaily(+b.dataset.i); return;

/* Пока в сейве стоит метка «ждём платёж», игра сама переспрашивает сервер
   раз в PAY_WATCH_SEC секунд, не дольше PAY_WATCH_MIN минут. Это спасает случай,
   когда после окна оплаты мини-апп перезапустился и колбэк openInvoice не отработал. */
let payWatchAt = 0;
async function watchPayment(){
  if(!S.payPending || PAY.mode !== 'live' || !PAY.backend) return;
  if(Date.now() - S.payPending > C.PAY_WATCH_MIN*60000){ S.payPending = 0; S.payPack = ''; save(); return; }
  if(Date.now() - payWatchAt < C.PAY_WATCH_SEC*1000) return;
  payWatchAt = Date.now();
  await pullServer();
}
function loop(){
  tickLive();
  watchPayment();
  tickEnergy();
  const hadHour = S.hour;
  rollHour();
  if(hadHour !== S.hour && cur === 'task') renderTasks();   // час сменился — перерисуем список
  if(cur === 'task'){ const dt = document.getElementById('dTimer'); if(dt) dt.textContent = mmss(nextDayAt() - Date.now()); }
  const qt = document.getElementById('qTimer');
  if(qt) qt.textContent = mmss(nextHourAt() - Date.now());
  const got = tickOrders();
  renderHud();
  // Таймеры пустых слотов тикают на любой вкладке — полоса заказов видна всегда
  if(got) renderOrders();
  else {
    const em = document.querySelectorAll('#orders .order.empty');
    const l = Math.max(0, S.orderCdUntil - Date.now());
    em.forEach(e=>{ if(e.textContent.indexOf('🔒') < 0) e.textContent = l > 0 ? mmss(l) : '…'; });
  }
  tickBizNudge();
  if(cur === 'biz') bizSync(false);
  const offersChanged = tickOffers();
  if(cur === 'shop' && (offersChanged || S.offers.length || S.starterUntil > Date.now()
      || S.drop2Until > Date.now() || coinCdLeft('coins_1') > 0 || coinCdLeft('coins_2') > 0)) renderShop();
  if(cur === 'league'){ const t = document.querySelector('#leagueBody .pt span:last-child'); if(t) t.textContent = mmss(endOfWeek()-Date.now()); }
  // На вкладке посылок тикает счётчик часа: без этого таймер стоял бы на месте
  if(cur === 'chest'){ const t = document.getElementById('chestCd'); if(t) t.textContent = mmss(nextHourAt() - Date.now()); }
  renderAlerts();
  const st = document.getElementById('stTimer');
  if(st) st.textContent = 'Предложение исчезнет через ' + mmss(S.starterUntil - Date.now());
}

/* ============ СТАРТ ============ */
function boot(){
  loadLocal();
  applyOffline();
  rollDay();
  weeklyPayout();   // при смене недели выдаём приз за место прошлой недели
  S.rows = Math.max(S.rows, rowsMax());
  fillOrders();
  if(!S.offerNextAt) S.offerNextAt = Date.now() + 60000;   // первое предложение через минуту
  buildBoard();
  S.tut = true;                  // первый запуск тоже начинается с пустого поля
  go('game');
  requestAnimationFrame(sizeBoard);
  loadCloud();
  pullServer();                  // вдруг платёж прошёл, пока игра была закрыта
  bizCatchRef();                 // пришёл по чьей-то ссылке — запоминаем один раз
  // сразу отдаём серверу привязку и свои цифры, следом просим список
  setTimeout(()=>{ sendPing(false, true); bizSync(true); }, 1500);
  setInterval(loop, 1000);
  save();
  if(weekendActive()) setTimeout(()=>openSheet(
    '<div class="bigem">🎪</div><h3 class="sh-h">Загул на выходные</h3>' +
    '<p class="sh-p">Полный бак, три посылки и ' + fmt(weekendCoins()) + ' 🪙. Лавочка работает только в субботу и воскресенье, и только один раз.</p>' +
    '<div class="sh-row"><button class="btn" data-act="close">Не сейчас</button>' +
    '<button class="btn pri" data-act="gbuy" data-id="offer_weekend">' + C.OFFER_WEEKEND_GEMS + ' 💎</button></div>'), 1200);
}
boot();

</script>
