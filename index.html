/* ============ ПЕРЕТАСКИВАНИЕ ============ */
let drag = null;
const ghost = $('#ghost');
function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  const c = el && el.closest ? el.closest('.cell') : null;
  return c ? +c.dataset.i : -1;
}
$('#board').addEventListener('pointerdown', e=>{
  const cell = e.target.closest('.cell'); if(!cell) return;
  const i = +cell.dataset.i;
  if(!S.board[i] || !cellOpen(i)) return;
  drag = { i, x:e.clientX, y:e.clientY, moved:false };
  try{ $('#board').setPointerCapture(e.pointerId); }catch(err){}
});
$('#board').addEventListener('pointermove', e=>{
  if(!drag) return;
  if(!drag.moved && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 7) return;
  if(!drag.moved){
    drag.moved = true;
    const src = document.querySelector('.cell[data-i="'+drag.i+'"] .item');
    if(src){
      ghost.innerHTML = src.outerHTML;
      const r = src.getBoundingClientRect(), g = ghost.firstChild;
      g.style.width = r.width+'px'; g.style.height = r.height+'px';
      ghost.style.display = 'block'; src.classList.add('dragging');
    }
  }
  ghost.style.left = e.clientX+'px'; ghost.style.top = (e.clientY-26)+'px';
  const over = cellAt(e.clientX, e.clientY-26);
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  if(over >= 0 && over !== drag.i && cellOpen(over))
    document.querySelector('.cell[data-i="'+over+'"]').classList.add('over');
});
$('#board').addEventListener('pointerup', e=>{
  if(!drag) return;
  const d = drag; drag = null;
  ghost.style.display = 'none'; ghost.innerHTML = '';
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  const src = document.querySelector('.cell[data-i="'+d.i+'"] .item');
  if(src) src.classList.remove('dragging');
  if(!d.moved){ tapCell(d.i); return; }
  const to = cellAt(e.clientX, e.clientY-26);
  if(to < 0 || to === d.i || !cellOpen(to)){ renderBoard(); return; }
  if(!tryMerge(d.i,to)){
    const t = S.board[to]; S.board[to] = S.board[d.i]; S.board[d.i] = t;
    renderAll(); save();
  }
});
$('#board').addEventListener('pointercancel', ()=>{
  drag = null; ghost.style.display = 'none';
  document.querySelectorAll('.cell.over').forEach(c=>c.classList.remove('over'));
  renderBoard();
});
function tapCell(i){
  const it = S.board[i]; if(!it) return;
  const sp = specialOf(it.l);
  if(sp && it.ch != null && it.ch > 0){
    if(sp.type === 'producer'){
      if(countFree() <= 0){ toast('Класть некуда'); SFX.err(); haptic('err'); return; }
      const ni = spawn(Math.max(1, it.l - C.PRODUCER_BACK));
      if(ni >= 0) popCell(ni);
      SFX.tap();
    } else if(sp.type === 'safe'){
      const n = price(it.l) * C.SAFE_MULT;
      S.coins += n; quest('coins', n);
      toast('Касса: +' + fmt(n) + ' 🪙'); SFX.coin();
    } else if(sp.type === 'energy'){
      if(S.energy >= energyMax()) S.enTs = Date.now();
      S.energy += specialEnergy();
      toast('Генератор: +' + specialEnergy() + ' ⚡'); SFX.gem();
    } else if(sp.type === 'gems'){
      S.gems += C.SPECIAL_GEMS;
      toast('Копилка: +' + C.SPECIAL_GEMS + ' 💎'); SFX.gem();
    } else if(sp.type === 'chest'){
      S.pendingChests++;
      toast('Посылка приехала, вскрой во вкладке'); SFX.gem();
    }
    it.ch--;
    if(it.ch <= 0) S.board[i] = null;
    haptic('light');
    renderAll(); save(); return;
  }
  itemSheet(i);
}

/* ============ КЛИКИ ============ */
$('#gen').addEventListener('click', genTap);
$('#btnMergeAll').addEventListener('click', mergeAll);
$('#btnHelp').addEventListener('click', helpSheet);
document.querySelectorAll('.tier').forEach(b=>b.addEventListener('click', ()=>{
  const t = +b.dataset.tier;
  if(!tierOpen(t)){ toast('Сначала выкупи всё в разделе «' + TIER_NAME[t-1] + '»'); SFX.err(); haptic('err'); return; }
  go('vip', t);
}));
$('#reroll').addEventListener('click', rerollOrders);
$('#orders').addEventListener('click', e=>{ const b = e.target.closest('[data-o]'); if(b) completeOrder(+b.dataset.o); });
$('#hGemBtn').addEventListener('click', ()=>go('shop'));
$('#hSnd').addEventListener('click', ()=>{ S.sound = S.sound === false; if(S.sound) SFX.gem(); renderHud(); save(); });
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>go(t.dataset.s)));
$('#veil').addEventListener('click', e=>{ if(e.target === $('#veil')) closeSheet(); });
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, inSheet = !!b.closest('#veil');
  switch(a){
    case 'close': closeSheet(); return;
    case 'yes': $('#veil').classList.remove('on'); if(askRes){ askRes(true); askRes = null; } return;
    case 'no': closeSheet(); return;
    case 'toshop': closeSheet(); go('shop'); return;
    case 'pack': PAY.buy(b.dataset.id); return;
    case 'gbuy': { const id = b.dataset.id; if(inSheet) $('#veil').classList.remove('on'); gemBuy(id); return; }
    case 'sell': {
      const i = +b.dataset.i, it = S.board[i];
      if(it){ const p = price(it.l); S.coins += p; S.board[i] = null; quest('coins', p);
              toast('Сбагрил за ' + fmt(p) + ' 🪙'); SFX.coin(); haptic('ok'); }
      closeSheet(); renderAll(); save(); return;
    }
    case 'chest-coins': {
      const p = chestCoinPrice();
      if(S.coins < p){ toast('Монет не хватает'); SFX.err(); return; }
      S.coins -= p; openChests(1); return;
    }
    case 'chest-free': {
      const n = S.pendingChests; if(n <= 0) return;
      S.pendingChests = 0; openChests(n); return;
    }
    case 'chest-daily':
      if(!isPremium() || S.dailyChestDay === dayKey()) return;
      S.dailyChestDay = dayKey(); openChests(1); return;
    case 'quest': claimQuest(+b.dataset.i); return;
    case 'qreroll': rerollQuests(); return;
    case 'vipbuy': vipBuy(+b.dataset.i, +b.dataset.t); return;
    case 'offerbuy': offerBuy(+b.dataset.i); return;
    case 'help':    helpSheet(); return;
    case 'tos':     tosSheet(); return;
    case 'privacy': privacySheet(); return;
    case 'wipe': wipeSave(); return;
  }
});

/* ============ ЦИКЛ ============ */
function loop(){
  tickEnergy();
  const hadHour = S.hour;
  rollHour();
  if(hadHour !== S.hour && cur === 'task') renderTasks();   // час сменился — перерисуем список
  const qt = document.getElementById('qTimer');
  if(qt) qt.textContent = mmss(nextHourAt() - Date.now());
  const got = tickOrders();
  renderHud();
  // Таймеры пустых слотов тикают на любой вкладке — полоса заказов видна всегда
  if(got) renderOrders();
  else {
    const em = document.querySelectorAll('#orders .order.empty');
    const l = Math.max(0, S.orderCdUntil - Date.now());
    em.forEach(e=>{ if(e.textContent.indexOf('🔒') < 0) e.textContent = l > 0 ? mmss(l) : '…'; });
  }
  const offersChanged = tickOffers();
  if(cur === 'shop' && (offersChanged || S.offers.length || S.starterUntil > Date.now()
      || S.drop2Until > Date.now() || coinCdLeft('coins_1') > 0 || coinCdLeft('coins_2') > 0)) renderShop();
  if(cur === 'league'){ const t = document.querySelector('#leagueBody .pt span:last-child'); if(t) t.textContent = mmss(endOfWeek()-Date.now()); }
  renderAlerts();
  const st = document.getElementById('stTimer');
  if(st) st.textContent = 'Предложение исчезнет через ' + mmss(S.starterUntil - Date.now());
}

/* ============ СТАРТ ============ */
function boot(){
  loadLocal();
  applyOffline();
  rollDay();
  weeklyPayout();   // при смене недели выдаём приз за место прошлой недели
  S.rows = Math.max(S.rows, rowsMax());
  fillOrders();
  if(!S.offerNextAt) S.offerNextAt = Date.now() + 60000;   // первое предложение через минуту
  buildBoard();
  S.tut = true;                  // первый запуск тоже начинается с пустого поля
  go('game');
  requestAnimationFrame(sizeBoard);
  loadCloud();
  pullServer();                  // вдруг платёж прошёл, пока игра была закрыта
  setInterval(loop, 1000);
  save();
  if(weekendActive()) setTimeout(()=>openSheet(
    '<div class="bigem">🎪</div><h3 class="sh-h">Загул на выходные</h3>' +
    '<p class="sh-p">Полный бак, три посылки и ' + fmt(weekendCoins()) + ' 🪙. Лавочка работает только в субботу и воскресенье, и только один раз.</p>' +
    '<div class="sh-row"><button class="btn" data-act="close">Не сейчас</button>' +
    '<button class="btn pri" data-act="gbuy" data-id="offer_weekend">' + C.OFFER_WEEKEND_GEMS + ' 💎</button></div>'), 1200);
}
boot();

</script>
