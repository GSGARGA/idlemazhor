<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E13">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="assets/icon-32.png" sizes="32x32">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
<title>МАЖОР</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;800&display=swap">

<style>
/* ============ ОФОРМЛЕНИЕ ============
   Одна тема: ночной обменник. Фон красим явно. */
:root{
  --bg:#0A0E13; --bg2:#101720; --panel:#16202B; --panel2:#1E2B39;
  --line:#2A3B4D; --line2:#3A5068;
  --ink:#E9F2F8; --muted:#8199AC; --dim:#5E7488;
  --green:#4FC98A; --green-d:#2B7F55;
  --gold:#FFCE3D; --red:#FF6B4A; --gem:#5BD5FF; --purple:#B06BFF;
  --r1:#4FC98A; --r2:#4AA8FF; --r3:#B06BFF; --r4:#FFCE3D; --r5:#FF4D4D;
  --disp:'Unbounded',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#05080B;color:var(--ink);font-family:var(--body);
  overflow:hidden;overscroll-behavior:none;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Игра всегда занимает весь экран телефона.
   Раскладка считалась под 360 × 780 (Galaxy A16), но ширина и высота тянутся:
   --app-w  предел ширины (планшет, десктоп), ставит JS из C.APP_MAX_W
   --app-h  высота окна Telegram, ставит JS; без Telegram — 100dvh
   --safe-* безопасные зоны: часы сверху, полоска жеста снизу, шапка Telegram */
#app{
  width:100%;max-width:var(--app-w,520px);
  height:var(--app-h,100dvh);
  padding-top:var(--safe-top,0px);padding-bottom:var(--safe-bot,0px);
  display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 55% at 50% 0%, #14202C 0%, var(--bg) 62%);
}

/* ---------- ШАПКА (фикс 74) ---------- */
#hud{flex:0 0 74px;height:74px;padding:8px 10px 5px;display:flex;flex-direction:column;gap:5px}
.hud-top{display:grid;grid-template-columns:52px 1fr 1fr 28px;gap:5px;align-items:center;height:28px}
.stat.full{border-color:var(--red);color:var(--red)}
.stat{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--panel);
  border:1px solid var(--line);border-radius:999px;padding:0 8px;height:28px;
  font-weight:800;font-size:13.5px;line-height:1;overflow:hidden;white-space:nowrap}
#hGemBtn{border-color:var(--gem);color:var(--gem)}
.lvlchip{font-family:var(--disp);font-weight:700;font-size:11.5px;
  background:linear-gradient(180deg,var(--green),var(--green-d));
  color:#04120B;border-radius:999px;height:28px;display:flex;align-items:center;justify-content:center}
#hSnd{background:var(--panel);border:1px solid var(--line);border-radius:999px;height:28px;
  width:28px;display:flex;align-items:center;justify-content:center;font-size:13px}
#hSnd.off{opacity:.45}
.bars{display:flex;gap:5px;height:36px}
.bar{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 8px;overflow:hidden}
.bar .lab{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);
  letter-spacing:.05em;text-transform:uppercase;font-weight:800;margin-bottom:3px;
  white-space:nowrap;line-height:14px;height:14px}
.bar .lab span:last-child{overflow:hidden;text-overflow:ellipsis}
.track{height:6px;background:#0A1119;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;transition:width .25s}
.fill.en{background:linear-gradient(90deg,#FF9A3D,var(--gold))}
.fill.xp{background:linear-gradient(90deg,var(--green-d),var(--green))}
.fill.gm{background:linear-gradient(90deg,#2E86AD,var(--gem))}

/* ---------- ЗАКАЗЫ (фикс 74) ---------- */
#ordersRow{flex:0 0 74px;height:74px;padding:0 10px 5px;display:flex;gap:5px}
#orders{flex:1;min-width:0;display:flex;gap:5px}
.order{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  position:relative;overflow:hidden}
.order.ready{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
.order .em{font-size:24px;line-height:1;position:relative;
  filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.order .em::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:150%;height:150%;border-radius:50%;z-index:-1;
  background:radial-gradient(circle, var(--lc,transparent) 0%, transparent 64%);opacity:.36}
.order .nm{font-size:8.5px;color:var(--muted);font-weight:700;text-align:center;line-height:1.1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order .rw{font-size:10px;font-weight:800;color:var(--gold)}
.order.empty{color:var(--dim);justify-content:center;font-size:10px;font-weight:700}
.order .lvbadge{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:var(--dim)}
#reroll{flex:0 0 44px;width:44px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#reroll .e{font-size:17px;line-height:1}
#reroll .c{font-size:7.5px;font-weight:800;color:var(--gem);line-height:1.2}
#reroll.free .c{color:var(--green)}

/* ---------- ПОЛЕ ---------- */
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px;flex:1}

#boardWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:2px 10px}
#board{--cell:60px;display:grid;
  grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(5,var(--cell));
  gap:5px;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{background:#0E151D;border:1px solid #1B2836;border-radius:12px;
  display:flex;align-items:center;justify-content:center;position:relative}
.cell.locked{background:repeating-linear-gradient(45deg,#0C1219 0 6px,#0F1720 6px 12px);border-color:#16202B}
.cell.locked::after{content:'🔒';font-size:13px;opacity:.35}
.cell.over{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,206,61,.35) inset}
.cell.hint{animation:hintp 1s ease-in-out 3}
@keyframes hintp{0%,100%{box-shadow:0 0 0 0 rgba(79,201,138,0)}50%{box-shadow:0 0 0 3px rgba(79,201,138,.55) inset}}
.item{width:100%;height:100%;border-radius:11px;display:flex;align-items:center;justify-content:center;
  position:relative;background:linear-gradient(180deg,var(--b1,var(--panel2)),var(--b2,var(--panel)));
  border:2px solid var(--rc,var(--r1));
  box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 14px -7px var(--rc,var(--r1));
  font-size:calc(var(--cell,60px) * .54);line-height:1}
/* Сейф Мажора: золотая обводка и мягкое свечение, чтобы его нельзя было спутать с вещью */
.item.vault{background:linear-gradient(180deg,#2A2415,#161208);
  box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 18px -4px var(--rc);
  animation:vaultp 1.8s ease-in-out infinite}
@keyframes vaultp{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 14px -6px var(--rc)}
  50%{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 22px -2px var(--rc)}}
.item .lv{position:absolute;bottom:0;right:4px;font-size:calc(var(--cell,60px) * .2);font-weight:800;
  color:var(--rc,var(--r1));font-family:var(--disp)}
/* Подсветка под значком. Оттенок свой на каждый уровень (--lc ставит renderBoard),
   поэтому соседние предметы различаются даже когда эмодзи почти одинаковые —
   у Apple, например, 💵 💴 💶 💷 это одна купюра в четырёх цветах.
   Рамка при этом по-прежнему показывает редкость, её смысл не тронут. */
.item::before{content:'';position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  width:92%;height:92%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, var(--lc,transparent) 0%, transparent 68%);opacity:.30}
/* тёмный контур под самим значком: светлые купюры перестают тонуть в фоне */
.item .em{position:relative;filter:drop-shadow(0 2px 4px rgba(0,0,0,.9))}
.item .ch{position:absolute;top:-3px;left:3px;font-size:10px;font-weight:800;color:var(--gold);
  background:#0A0E13;border-radius:99px;padding:0 4px;border:1px solid var(--line)}
.item .sp{position:absolute;top:-4px;right:-3px;font-size:12px;line-height:1;
  background:#0A0E13;border-radius:99px;padding:1px 2px;border:1px solid var(--line2)}
.item.special{box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 16px -5px var(--rc,var(--r1))}
.item.galaxy{border-style:double;border-width:4px;
  box-shadow:0 3px 0 rgba(0,0,0,.4), 0 0 18px -4px var(--rc,var(--r1)), inset 0 0 12px -6px #fff}
.item .gx{position:absolute;top:-4px;left:-3px;font-family:var(--disp);font-weight:700;font-size:9px;
  color:#0A0E13;background:var(--rc,var(--r1));border-radius:99px;padding:0 4px;line-height:14px}
.item.dragging{opacity:.25}
.item.pop{animation:pop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#ghost{position:fixed;pointer-events:none;z-index:90;transform:translate(-50%,-50%) scale(1.12);
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.6));display:none}

/* ---------- ТОЛЬКО ВЕРТИКАЛЬНО ---------- */
/* Если телефон всё-таки повернули — вместо поехавшей вёрстки просим повернуть
   обратно. Перекрывает всё, включая открытые окна. */
#rot{position:fixed;inset:0;z-index:200;display:none;padding:24px;text-align:center;
  flex-direction:column;align-items:center;justify-content:center;gap:13px;
  background:radial-gradient(115% 95% at 50% 22%,#16263F 0%,#0A0E13 72%)}
#rot.on{display:flex}
#rot .re{font-size:50px;line-height:1;animation:rotwig 2.4s ease-in-out infinite}
#rot .rt{font-family:var(--disp);font-weight:700;font-size:20px}
#rot .rs{font-size:12px;color:var(--muted);font-weight:700;max-width:300px;line-height:1.6}
@keyframes rotwig{0%,42%{transform:rotate(-90deg)}58%,100%{transform:rotate(0)}}

/* ---------- ДОК (фикс 64) ---------- */
/* Три витрины на месте убранных рядов поля */
#tiers{flex:0 0 44px;height:44px;padding:2px 10px 2px;display:flex;gap:7px}
.tier{flex:1;min-width:0;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#0C1016,#070A0E);border:2px solid #000;
  box-shadow:0 0 0 1px #23303E, inset 0 1px 0 rgba(255,255,255,.05)}
.tier .te{font-size:17px;line-height:1}
.tier .tn{font-size:8px;font-weight:800;letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.tier .dot{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:99px;
  background:var(--red);display:none}
.tier.alert .dot{display:block}
.tier.t1{border-color:#D9A227;box-shadow:0 0 0 1px #6A4E10, 0 0 14px -6px #FFCE3D}
.tier.t1 .tn{color:#FFCE3D}
.tier.t2{border-color:#8FE6FF;box-shadow:0 0 0 1px #2E6C82, 0 0 16px -5px #8FE6FF}
.tier.t2 .tn{color:#BFF3FF}
.tier:disabled{opacity:.45}
.tier .lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:rgba(6,9,13,.72)}

/* Полоса «Бизнес-сообщество» под витринами — вход в приглашения.
   Витрины ужаты с 74 до 44 пикселей, освободившееся место занимает она. */
/* Отступ сверху такой же, как между полосой и банкоматом — 9 пикселей:
   2 даёт нижний padding витрин, остальные 7 — этот margin. */
#bizbar{flex:0 0 30px;height:30px;margin:7px 10px 4px;border-radius:12px;position:relative;
  display:flex;align-items:center;justify-content:center;gap:7px;overflow:hidden;
  background:linear-gradient(90deg,#0E1A24,#183044 52%,#0E1A24);
  border:2px solid #000;box-shadow:0 0 0 1px #2E6C82, 0 0 15px -7px #8FE6FF}
#bizbar .be{font-size:14px;line-height:1}
#bizbar .bt{font-size:9px;font-weight:800;letter-spacing:.07em;color:#BFF3FF}
#bizbar .bn{font-size:9px;font-weight:800;color:var(--muted)}
#bizbar .dot{position:absolute;top:4px;right:8px;width:8px;height:8px;border-radius:99px;
  background:var(--red);display:none}
#bizbar.alert .dot{display:block}
#bizbar.alert{border-color:#D9A227;box-shadow:0 0 0 1px #6A4E10, 0 0 17px -5px #FFCE3D}
#bizbar.alert .bt{color:#FFCE3D}

/* Строка человека в сообществе */
.frow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line);margin-bottom:5px}
.frow.off{opacity:.48}
.frow.rdy{border-color:var(--gold);box-shadow:0 0 0 1px #6A4E10}
.frow.top .fa{color:var(--gold);border-color:#6A4E10}
.frow .fa.med{font-size:17px}
.frow.me{border-color:var(--green);background:linear-gradient(90deg,#12241B,var(--panel))}
.frow.me .fa{color:var(--green)}

.frow .fa{width:32px;height:32px;border-radius:99px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#BFF3FF;
  background:linear-gradient(160deg,#1B2735,#0B131B);border:1px solid var(--line)}
.frow .fb{flex:1;min-width:0;display:block}
.frow .fn{display:block;font-weight:700;font-size:13px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fs{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ft{display:block;margin-top:5px}
/* Очки лиги — отдельной колонкой справа, чтобы никогда не обрезались */
.frow .fr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.frow .fp{font-size:12.5px;font-weight:800;color:var(--gold);white-space:nowrap;line-height:1}
.frow .fh{font-size:10px;font-weight:800;color:var(--dim);white-space:nowrap}

/* ---------- ВИТРИНА ---------- */
.vip{background:linear-gradient(180deg,#0C1016,#070A0E);border:2px solid #000;
  box-shadow:0 0 0 1px #23303E;border-radius:15px;padding:10px 11px;
  display:flex;align-items:center;gap:10px;margin-bottom:7px}
.vip.t1{border-color:#D9A227;box-shadow:0 0 0 1px #6A4E10, 0 0 14px -8px #FFCE3D}
.vip.t2{border-color:#8FE6FF;box-shadow:0 0 0 1px #2E6C82, 0 0 16px -8px #8FE6FF}
.vip .vi{font-size:26px;width:34px;text-align:center;flex:0 0 auto}
.vip .vb{flex:1;min-width:0}
.vip .vt{font-weight:800;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vip .vd{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;line-height:1.35}
/* Строка наград переносится: в одну она не влезала и обрезалась многоточием */
.vip .vd .rw{color:var(--gem)}
.vip.owned{opacity:.55}
.vip.owned .vt{color:var(--green)}
.vipnum{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--dim);width:22px;text-align:right;flex:0 0 auto}

#dock{flex:0 0 64px;height:64px;padding:5px 10px 4px;display:flex;gap:7px;align-items:stretch}
#gen{flex:1 1 0;min-width:0;background:linear-gradient(180deg,#2A3B4D,#16202B);
  border:1.5px solid var(--line2);border-radius:15px;padding:8px 11px;
  display:flex;align-items:center;gap:9px;box-shadow:0 3px 0 #0A1119}
#gen:active{transform:translateY(2px);box-shadow:0 1px 0 #0A1119}
#gen.dead{opacity:.5}
#gen .g-em{font-size:26px;line-height:1;flex:0 0 auto}
#gen .g-txt{flex:1 1 0;min-width:0;text-align:left}
#gen .g-t{font-family:var(--disp);font-weight:700;font-size:13.5px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gen .g-s{font-size:9.5px;color:var(--muted);font-weight:700;margin-top:1px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sq{position:relative;width:54px;flex:0 0 54px;background:var(--panel);border:1px solid var(--line);
  border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 2px}
.sq:active{transform:translateY(2px)}
.sq .e{font-size:19px}
.sq .t{font-size:6.5px;color:var(--muted);font-weight:800;white-space:nowrap}
.sq.hot{border-color:var(--green);box-shadow:0 0 10px -3px var(--green)}
.sq.hot .t{color:var(--green)}
.sq:disabled{opacity:.4}
.sq.cooling .t{color:var(--red);font-size:9px}
.sq.cooling .cnt{display:none}
.sq.cooling .e{opacity:.4}
.cnt{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:99px;
  background:var(--green);color:#04180E;font-size:10px;font-weight:800;line-height:18px;
  border:2px solid var(--bg);display:none}
.sq:not(:disabled) .cnt{display:block}
.cnt.mag{background:var(--gold);color:#241A00}

/* ---------- ТАБЫ (фикс 52) ---------- */
#tabs{flex:0 0 auto;height:calc(52px + env(safe-area-inset-bottom));display:flex;
  border-top:1px solid var(--line);background:var(--bg2);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:8px;font-weight:800;color:var(--dim);letter-spacing:.02em;position:relative}
.tab .e{font-size:17px;line-height:1}
.tab.on{color:var(--ink)}
.tab.on::before{content:'';position:absolute;top:0;left:20%;right:20%;height:3px;
  background:var(--green);border-radius:0 0 4px 4px}
.tab .dot{position:absolute;top:5px;right:calc(50% - 15px);width:8px;height:8px;border-radius:99px;
  background:var(--red);display:none}
.tab.alert .dot{display:block}

/* ---------- КАРТОЧКИ ---------- */
h2.sec{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin:15px 0 8px}
h2.sec:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 12px;
  display:flex;align-items:center;gap:11px;margin-bottom:8px}
.card .ci{font-size:27px;line-height:1;flex:0 0 auto;width:36px;text-align:center}
.card .cb{flex:1;min-width:0}
.card .ct{font-weight:800;font-size:14px}
.card .cd{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:2px}
.buy{flex:0 0 auto;border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px;white-space:nowrap;
  background:linear-gradient(180deg,#3E5570,#28394D);border:1px solid var(--line2)}
/* Раньше кнопки были заливные: жёлтая звезда терялась на жёлтом фоне,
   голубой алмаз — на голубом. Теперь подложка тёмная, а цвет несут рамка,
   текст и свечение — значок читается. */
.buy.gem{background:linear-gradient(180deg,#0E2E3E,#07202C);color:#7FE6FF;

.buy.danger{color:#FF9B7F}
.buy:disabled{opacity:.4}

.pill.g{color:var(--green)}.pill.o{color:var(--red)}.pill.p{color:var(--purple)}.pill.b{color:var(--gem)}
.tagline{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 7px;

/* ---------- ГАЧА ---------- */
.pitybox{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}

/* Список наград после вскрытия пачки посылок */
.loot{max-height:min(46vh,300px);overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin:2px 0 4px;

.divbar{display:flex;gap:4px;margin-bottom:10px}

/* ---------- ЛЕСТНИЦА УРОВНЕЙ ---------- */
.steps{display:flex;flex-direction:column;gap:5px}

.sh-row{display:flex;gap:8px;margin-top:10px}

.btn.pri{background:linear-gradient(180deg,#0E2E3E,#07202C);color:#7FE6FF;
  border:1.5px solid #35B6E8;box-shadow:0 0 14px -4px #35B6E8}

  border:1.5px solid #E5A800;box-shadow:0 0 14px -4px #E5A800}
.btn.gr{background:linear-gradient(180deg,#0F2E20,#082016);color:#6FE3A8;
  border:1.5px solid #34A46F;box-shadow:0 0 14px -4px #34A46F}
.timer{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--red);text-align:center;margin-top:8px}

#toasts{position:fixed;bottom:124px;left:0;right:0;z-index:120;display:flex;flex-direction:column-reverse;
  align-items:center;gap:5px;pointer-events:none;max-width:var(--app-w,520px);margin:0 auto;padding:0 10px}
.toast{background:#0E1720;border:1px solid var(--line2);border-radius:99px;padding:7px 14px;
  font-size:12px;font-weight:800;max-width:100%;text-align:center;line-height:1.3;animation:tin .25s ease}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.fly{position:fixed;z-index:110;pointer-events:none;font-weight:900;font-family:var(--disp);font-size:15px;

  border-left:2px solid var(--line2);padding-left:9px;margin:10px 0 2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
"use strict";
/* =====================================================================
   БАКСЫ В САМОЛЁТЫ — мерж-2 для Telegram Mini App.
   Валюты: монеты (мягкая, из игры) и алмазы (твёрдая, всё платное).
   Звёзды тратятся ТОЛЬКО на паки алмазов — см. PACKS и PAY.
   ===================================================================== */

/* ============ БЛОК КОНСТАНТ (весь баланс здесь) ============ */
const C = {
  SAVE_VERSION:      30,      // версия сейва; при росте запускается migrate()
  SAVE_KEY:          'bvs_save',
  SAVE_DEBOUNCE_MS:  700,    // задержка перед записью сейва

  APP_W:             360,    // базовая ширина раскладки, px (Galaxy A16: 1080/3)
  APP_H:             780,    // базовая высота раскладки, px (Galaxy A16: 2340/3)
  APP_MAX_W:         520,    // предел ширины на планшете и десктопе, px
  PAY_WATCH_MIN:     5,      // сколько минут игра доспрашивает сервер, если оплату не подтвердил клиент
  PAY_WATCH_SEC:     3,      // как часто она это делает, с
  PAY_SYNC_SEC:      20,     // через сколько секунд после покупки тихо сверить счёт с сервером, с
  PING_EVERY_SEC:    300,    // как часто отправлять на сервер накопленное время в игре, с
  PING_MIN_SEC:      20,     // меньше этого не отправляем — не гоняем сеть впустую, с
  BOARD_COLS:        5,      // колонок на поле
  BOARD_ROWS:        5,      // рядов на поле
  ROWS_START:        5,      // открыто рядов на старте (всё поле сразу)
  ROW_UNLOCK_LEVELS: [],     // рядов больше не добавляем: поле целиком открыто
  CHAIN_LEN:         100,    // предметов в одном витке: от Цента до Корпорации №1
  // Слияние двух Корпораций даёт Цент 101 уровня — начинается галактический
  // престиж: те же предметы, но цена и опыт продолжают расти без сброса
  MAX_LVL:           500,    // технический потолок — пять витков
  // На стыке витков редкость сбрасывается с мифической на обычную, и без этих
  // множителей цена и опыт проваливались бы вниз. Они компенсируют сброс с запасом.
  GALAXY_COIN_MULT:  7,      // множитель цены за каждый следующий виток
  GALAXY_XP_MULT:    60,     // множитель опыта за каждый следующий виток
  MAX_PLAYER_LVL:    500,    // потолок уровня игрока
  ENERGY_PER_LEVEL:  2,      // на сколько каждый уровень увеличивает бак
  // Награды за уровень растут ступенями: каждые 5 уровней +50%, но не выше ×10
  LVL_REWARD_STEP:   5,
  LVL_REWARD_BONUS:  0.5,
  LVL_REWARD_CAP:    10,
  LVL_GEM_DIV:       2,      // во столько раз режем алмазы за уровень

  ENERGY_MAX:        100,    // стартовый максимум энергии
  ENERGY_GEMS_PER_100: 60,   // алмазов за 100 энергии в магазине
  ENERGY_GEMS_OFFER:   30,   // столько же, но в разделе «Пока дают»
  REGEN_PER_100:       1,    // на сколько в минуту ускоряется откат за каждые 100 бака
  ENERGY_REGEN_SEC:  60,     // не используется напрямую: откат считается от размера бака
  ENERGY_TAP_COST:   2,      // базовая цена сброса банкомата, энергии
  TAP_COST_STEP:     5,      // каждые столько уровней игрока сброс дорожает на 1
  ENERGY_CAN_PCT:    0.30,   // «Канистра» доливает эту долю бака
  STARTER_ENERGY_PCT: 3,     // «Подъёмные» дают столько баков энергии
  ENERGY_OFFLINE_CAP_H: 24,  // сколько часов офлайна копится энергия

  // Минимальный сброс банкомата растёт за выполненные задания.
  // Без этого 100 уровней недостижимы: 100-й — это 2^99 центов.
  /* Сколько заданий поднимают сброс на уровень. Чем выше сброс, тем дороже шаг:
     [до какого уровня, сколько заданий]. Последняя строка действует дальше. */
  GEN_STEPS:         [[20,2],[40,3],[60,4],[Infinity,5]],
  GEN_SPREAD:        1,      // насколько выше минимума может выпасть предмет
  GEN_PLUS2_CHANCE:  0.12,   // шанс выдать ещё на уровень выше

  PRODUCER_BACK:     6,      // на сколько уровней ниже станок выдаёт предмет
  SPECIAL_ENERGY:    1,      // сколько энергии даёт Генератор за один тап
  SPECIAL_GEMS:      1,      // сколько алмазов даёт Копилка за тап
  SPECIAL_CHANCE:    0.10,   // вероятность, что новый предмет придёт заряженным
  SPECIAL_CH_STEP:   10,     // сначала плюс один заряд за каждые столько уровней
  SPECIAL_CH_MAX:    5,      // столько зарядов набирается быстро, дальше медленно
  SPECIAL_CH_SLOW:   50,     // после этого — плюс один заряд за каждые столько уровней
  SAFE_MULT:         2,      // во сколько раз Касса дороже обычной продажи

  XP_BASE:           50,     // опыт для 2-го уровня игрока
  XP_POW:            1.20,   // степень роста требований опыта
  XP_PER_MERGE:      1,      // базовый опыт за мердж, множится на редкость
  XP_PER_QUEST_BONUS: 0.10,  // каждое выполненное задание даёт +10% ко всему опыту
  XP_PER_ORDER_LVL:  4,      // опыт за заказ = это * уровень, множится на редкость

  ORDER_SLOTS:       3,      // слотов заказов
  ORDER_SLOTS_PREM:  1,      // сколько добавляет Золотая карта
  ORDER_REFRESH_SEC: 90,     // ожидание нового заказа после сдачи
  ORDER_COIN_MULT:   30,     // монет за заказ = цена предмета * это
  COIN_CAP_MIN:      10000,  // стартовый потолок кошелька, монет
  COIN_CAP_MULT:     10,     // потолок = столько самых жирных заказов
  CAP_UP_PCT:        0.10,   // на сколько поднимает потолок одна докупка
  CAP_COIN_PER_HOUR: 1,      // сколько раз в час можно поднять потолок за все монеты
  CAP_GEM_PER_HOUR:  3,      // сколько раз в час можно поднять потолок за алмазы
  CAP_GEM_PRICE:     30,     // цена такой докупки, алмазов

  // Сейф Мажора — редкая находка на поле. Шанс и содержимое зависят от редкости.
  VAULT_CHANCE:  [0.025, 0.01, 0.005, 0.005, 0.001], // шанс сейфа по редкостям
  VAULT_CAP_PCT: [0.01, 0.02, 0.05, 0.10, 0.20],    // прибавка к максимуму монет
  VAULT_GEMS:    [1, 2, 3, 5, 15],                  // алмазов внутри
  VAULT_MAGNETS: [1, 2, 3, 4, 5],                   // магнитов внутри
  ORDER_CHEST_CHANCE:0.20,   // шанс посылки в награду
  ORDER_GEM_CHANCE:  0.14,   // шанс алмазов в награду
  ORDER_GEMS:        [3,8],  // сколько алмазов может дать заказ
  ORDER_LVL_SPREAD:  10,     // насколько выше минимального сброса бывает заказ
  QUEST_REACH_SPREAD: 13,    // насколько выше сброса бывает цель задания «собери предмет»
  QUEST_HAND:        [7,15], // сколько ручных слияний просит задание
  QUEST_SELL:        8,      // сколько предметов просит продать задание
  QUEST_VAULT:       5,      // сколько сейфов просит вскрыть задание

  // Задания на день: два штуки, награда случайная из четырёх
  DAILY_COUNT:       2,      // сколько дневных заданий выдаётся
  DAILY_ORDERS:      20,     // сдать заказов
  DAILY_HAND:        150,    // объединить вручную
  DAILY_TAPS:        500,    // тапнуть банкомат
  DAILY_CHESTS:      10,     // награда: посылок
  DAILY_GEMS:        150,    // награда: алмазов
  DAILY_PTS:         150,    // награда: очков лиги
  DAILY_BAK:         10,     // награда: прибавка к баку навсегда
  REROLL_FREE_DAY:   1,      // бесплатных смен всех заказов в день
  REROLL_GEMS:       20,     // цена смены заказов сверх лимита

  SELL_BASE:         5,      // цена продажи предмета 1-го уровня
  SELL_POW:          1.28,   // во сколько раз дороже каждый следующий уровень

  MERGE_ALL_CD_MIN:  5,      // кулдаун «Магнита», когда зарядов нет
  MAGNET_PER_MERGES: 5,      // столько ручных слияний заряжают один бесплатный магнит

/* =====================================================================
   ПЛАТЕЖИ. Клиент не выставляет счета: ссылку делает бот через
   createInvoiceLink, клиент открывает tg.openInvoice, зачисляет сервер.
   mock — покупка тестовая, алмазы начисляются локально.
   live — идём в бэкенд, начисляет сервер по вебхуку.
   ===================================================================== */
const PAY = {
  mode: 'live',                                          // боевой режим: звёзды списываются по-настоящему
  backend: 'https://mazhor-pay.vertoprah02.workers.dev', // сервер оплаты на Cloudflare
  async buy(packId){
    const p = PACKS.find(x=>x.id === packId);
    if(!p) return;
    if(this.mode === 'mock'){
      const ok = await ask('Покупка понарошку',
        p.title + ' — ' + p.gems + ' 💎 за ' + p.stars + ' ⭐\n\nБэкенда пока нет: звёзды не спишутся, алмазы дадим.',
        'Забрать');
      if(!ok) return;
      addGems(p.gems, 'Купил ' + p.title.toLowerCase());
      return;
    }
    try{
      const r = await fetch(this.backend + '/api/invoice', { method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ product: packId, initData:(tg && tg.initData) || '' })});
      const d = await r.json();
      if(!d.link) throw 0;
      /* Метка «ждём платёж». Она лежит в сейве, поэтому переживает перезагрузку игры:
         Telegram на некоторых клиентах перезапускает мини-апп после окна оплаты,
         и колбэк ниже до конца не доживает. Метку разбирает watchPayment() в цикле. */
      S.payPending = Date.now(); S.payPack = packId; saveNow();
      tg.openInvoice(d.link, async st=>{
        if(st !== 'paid'){
          S.payPending = 0; S.payPack = ''; save();
          toast(st === 'cancelled' ? 'Отменил' : 'Оплата не прошла'); return;
        }
        /* Telegram сказал «оплачено» — этого достаточно, начисляем сразу.
           Ждать сервер нельзя: он узнаёт о платеже отдельным письмом, да ещё и
           хранилище Cloudflare отдаёт свежую запись не мгновенно. Двойного
           начисления не будет: boughtApplied двигаем вместе с алмазами, и когда
           сервер догонит, разница окажется нулевой. */
        S.gems += p.gems;
        S.boughtApplied = (S.boughtApplied|0) + p.gems;
        payDone(p.gems, p);
        // Тихая сверка с сервером чуть позже — на случай покупки с другого телефона
        setTimeout(()=>pullServer(), C.PAY_SYNC_SEC*1000);
      });
    }catch(e){ toast('Магазин недоступен'); }
  }
};
async function pullServer(){
  if(PAY.mode !== 'live' || !PAY.backend) return;
  try{
    const r = await fetch(PAY.backend + '/api/state', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData:(tg && tg.initData) || '' })});
    const d = await r.json();
    /* Сервер считает только купленное за звёзды: сколько всего алмазов человек
       оплатил за всё время. Заработанное игрой он не видит и не трогает.
       В игру добавляем разницу между этим числом и тем, что уже зачислено —
       так покупка не потеряется, но и не начислится дважды. */
    if(d.bought != null){
      const diff = (d.bought|0) - (S.boughtApplied|0);
      if(diff > 0) S.gems += diff;
      S.boughtApplied = d.bought|0;
      renderAll(); save();
      // Ждали платёж и он пришёл — показываем окно прямо в игре, кто бы ни спросил сервер
      if(diff > 0 && S.payPending){ payDone(diff); return; }
    }
    renderAll(); save();
  }catch(e){}
}

/* ---------- СЧЁТЧИК ВРЕМЕНИ В ИГРЕ ----------
   Считаем только секунды, когда игра реально на экране: свернул — счёт встал.
   Копим у себя и отправляем пачкой раз в PING_EVERY_SEC, а также при уходе
   со страницы. Так на сервере получается одна запись вместо сотни. */
let liveSec = 0, liveTs = Date.now(), pingTs = Date.now();
function tickLive(){
  const now = Date.now();
  const gap = (now - liveTs) / 1000;
  liveTs = now;
  // пауза больше минуты — значит игра была свёрнута, это время не наше
  if(document.visibilityState === 'visible' && gap > 0 && gap < 60) liveSec += gap;
  if(now - pingTs > C.PING_EVERY_SEC*1000) sendPing(false);
}
/* Одним запросом отдаём и время, и всё про сообщество: уровень, очки лиги,
   добытые алмазы, кто привёл. Так на сервере получается ОДНА запись вместо
   двух, и данные друзей всегда свежие. */
function sendPing(leaving, force){
  if(PAY.mode !== 'live' || !PAY.backend) return;
  const sec = Math.round(liveSec);
  if(sec < C.PING_MIN_SEC && !force) return;
  liveSec = 0; pingTs = Date.now();
  const name = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) || '';
  const b = { initData:(tg && tg.initData) || '', sec, name,
              lvl:S.level|0, pts:leaguePts()|0, ref:(S.biz && S.biz.ref) || '' };
  /* Добычу отдаём только обычным запросом: у маячка нельзя прочитать ответ,
     а значит нельзя убедиться, что она дошла, и её бы потеряли. */
  const pool = leaving ? 0 : Math.max(0, S.biz.pool|0);
  if(pool > 0) b.gems = pool;
  const body = JSON.stringify(b);
  try{
    // при уходе обычный fetch могут не успеть отправить — шлём маячком
    if(leaving && navigator.sendBeacon){
      navigator.sendBeacon(PAY.backend + '/api/ping', new Blob([body], {type:'application/json'}));
      return;
    }
    fetch(PAY.backend + '/api/ping', { method:'POST',
      headers:{'Content-Type':'application/json'}, body, keepalive:true })
      .then(r=>r.json())
      .then(d=>{ if(d && d.ok) pingBack(d, pool); })
      .catch(()=>{});
  }catch(e){}
}

function applyInsets(){

const SFX = {
  ctx:null,
  ready(){
    if(!this.ctx){
      const A = window.AudioContext || window.webkitAudioContext;
      if(!A) return false;
      try{ this.ctx = new A(); }catch(e){ return false; }
    }
    if(this.ctx.state === 'suspended'){ try{ this.ctx.resume(); }catch(e){} }

  },
  note(f,f2,d,type,v,delay){

    const t0 = this.ctx.currentTime + (delay||0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0+d);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(v||0.1, t0+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+d+0.03);
  },
  tap(){    this.note(190,130,0.06,'square',0.05); },
  merge(r){ const f = 260*Math.pow(1.22,r);
            this.note(f,f*1.6,0.10,'triangle',0.11);

  cascade(n){ const k = Math.min(n,10);
            for(let i=0;i<k;i++) this.note(300*Math.pow(1.12,i),null,0.07,'triangle',0.07,i*0.045); },
  coin(){   this.note(880,null,0.06,'square',0.07); this.note(1320,null,0.09,'square',0.06,0.05); },
  gem(){    [660,880,1180].forEach((f,i)=>this.note(f,null,0.10,'square',0.07,i*0.05)); },
  order(){  [523,659,784].forEach((f,i)=>this.note(f,null,0.13,'sine',0.10,i*0.06)); },
  level(){  [523,659,784,1046].forEach((f,i)=>this.note(f,null,0.20,'triangle',0.11,i*0.09)); },
  chest(r){ const b = [392,440,523,659,784][r];

/* ============ МИГРАЦИЯ ============
   v5 и раньше: девять цепочек по 12 уровней. Теперь одна на 100.
   Старые предметы переводим по правилу «цепочка × 12 + уровень», чтобы
   прогресс не обнулился, и режем по потолку. */
function migrate(raw){
  if(!raw || typeof raw !== 'object') return fresh();
  let s = raw;
  const f = fresh();
  const oldV = s.v|0;
  const oldLen = Array.isArray(s.board) ? s.board.length : 0;
  if(oldLen !== CELLS || oldV < 6){
    const keep = (Array.isArray(s.board) ? s.board : []).filter(x=>x && typeof x === 'object');
    const nb = new Array(CELLS).fill(null);
    let extra = 0;
    for(let i=0;i<keep.length;i++){
      const it = keep[i];
      const lvl = (oldV < 6 && it.c != null)
        ? clamp((it.c|0)*12 + (it.l|0), 1, C.MAX_LVL)   // из старой сетки цепочек
        : clamp(it.l|0, 1, C.MAX_LVL);
      if(i < CELLS) nb[i] = { l:lvl, ch:null };
      else extra += 5 * Math.pow(1.28, lvl-1);
    }
    s.board = nb;
    if(extra > 0) s.coins = (s.coins||0) + Math.round(extra);
  }
  if(oldV < 6){
    // seen был объектом с уровнями по цепочкам — сводим в одно число
    let m = 1;
    if(s.seen && typeof s.seen === 'object'){
      const ids = ['cash','wear','tech','food','ride','pets','home','fun','lux'];
      for(let i=0;i<ids.length;i++){ const v = s.seen[ids[i]]|0; if(v) m = Math.max(m, i*12+v); }
    } else if(typeof s.seen === 'number') m = s.seen;
    s.seen = clamp(m, 1, C.MAX_LVL);
    s.orders = [];              // формат заказов изменился
    s.questsDone = s.questsDone|0;
  }
  for(const k in f) if(s[k] === undefined) s[k] = f[k];
  s.board = s.board.map(it=>{
    if(!it || typeof it !== 'object') return null;
    const l = clamp(it.l|0, 1, C.MAX_LVL);
    /* v20 → v21: заряд перестал выводиться из уровня и хранится в предмете.
       Старым заряженным вещам проставляем тип по прежнему правилу кратностей,
       чтобы сохранённые Кассы и Станки не превратились в пустышки. */
    // v26 → v27: в клетке может лежать сейф — у него своя редкость и нет зарядов
    const vault = (it.vault != null && it.vault >= 0 && it.vault < 5) ? (it.vault|0) : null;
    if(vault != null) return { l, ch:null, sp:null, vault };
    let sp = it.sp;
    if(sp == null && it.ch != null) sp = oldSpecialIdx(l);
    if(sp != null && !SPECIALS[sp]) sp = null;
    const ch = it.ch == null ? null : Math.max(0, it.ch|0);
    return sp == null || !ch ? { l, ch:null, sp:null } : { l, ch, sp };
  });
  s.level = clamp(s.level|0 || 1, 1, C.MAX_PLAYER_LVL);
  s.seen  = clamp(s.seen|0 || 1, 1, C.MAX_LVL);
  s.gems  = Math.max(0, s.gems|0);
  if(s.lvlTaken == null || s.lvlTaken < 1) s.lvlTaken = 1;
  if(typeof s.hour !== 'string') s.hour = '';   // v9 → v10: задания стали почасовыми
  if(!s.coinCd || typeof s.coinCd !== 'object') s.coinCd = {};   // v10 → v11: пакеты монет с кулдауном
  delete s.dblLeft;                             // v13 → v14: «Ксерокс» убран из игры
  s.galaxySeen = Math.max(1, s.galaxySeen|0 || 1);   // v14 → v15: витки цепочки
  if(!Array.isArray(s.offers)) s.offers = [];        // v16 → v17: живые предложения
  s.offerNextAt = s.offerNextAt|0;
  s.cycle = Math.max(1, s.cycle|0 || 1);        // v11 → v12: круги престижа
  s.ptsBank = Math.max(0, s.ptsBank|0);
  if(!Array.isArray(s.vip) || s.vip.length !== 3) s.vip = [[],[],[]];
  s.vip = s.vip.map(a=>Array.isArray(a) ? a.filter(n=>Number.isInteger(n) && n >= 0 && n < C.VIP_COUNT) : []);
  s.boughtApplied = Math.max(0, s.boughtApplied|0);   // v19 → v20: счётчик покупок за звёзды
  s.itemChests = Math.max(0, s.itemChests|0);        // v21 → v22: посылки с предметов отдельно
  s.vipEver = Math.max(0, s.vipEver|0);              // v22 → v23: выкупленное в прошлых кругах
  if(typeof s.chestHour !== 'string') s.chestHour = '';   // v23 → v24: часовой лимит посылок за монеты
  s.chestUsed = Math.max(0, s.chestUsed|0);
  s.bestOrder = Math.max(0, +s.bestOrder || 0);      // v24 → v25: потолок кошелька
  s.capMul = Math.max(1, +s.capMul || 1);            // v25 → v26: докупки потолка
  if(typeof s.capHour !== 'string') s.capHour = '';
  s.capCoinUsed = Math.max(0, s.capCoinUsed|0);
  s.capGemUsed  = Math.max(0, s.capGemUsed|0);
  if(!Array.isArray(s.daily)) s.daily = [];          // v27 → v28: задания на день
  s.bakBonus = Math.max(0, s.bakBonus|0);
  // v28 → v29: бизнес-сообщество. Старые сейвы просто получают пустое.
  if(!s.biz || typeof s.biz !== 'object') s.biz = f.biz;
  s.biz.ref = String(s.biz.ref || '');
  s.biz.list = Array.isArray(s.biz.list) ? s.biz.list : [];
  if(!s.biz.taken || typeof s.biz.taken !== 'object') s.biz.taken = {};
  s.biz.pool = Math.max(0, s.biz.pool|0);
  s.biz.got  = Math.max(0, s.biz.got|0);
  s.biz.stepGems = Math.max(0, s.biz.stepGems|0);
  s.biz.rankTaken = Math.max(0, s.biz.rankTaken|0);   // v29 → v30: награды штата
  s.payPending = Math.max(0, +s.payPending || 0);
  if(typeof s.payPack !== 'string') s.payPack = '';
  s.magnets = Math.max(0, s.magnets|0);
  s.mergeStreak = clamp(s.mergeStreak|0, 0, C.MAGNET_PER_MERGES-1);
  if(!Array.isArray(s.orders)) s.orders = [];
  s.orders = s.orders.filter(o=>o && typeof o.l === 'number');
  s.v = C.SAVE_VERSION;
  return s;
}

const $ = s => document.querySelector(s);
const rndInt = (a,b) => a + Math.floor(Math.random()*(b-a+1));

// Круги престижа уводят числа за триллионы, поэтому суффиксы идут до 10^90
const SUF = ['','k','M','B','T','P','E','Z','Y','R','Q','aa','ab','ac','ad','ae','af','ag','ah','ai',
             'aj','ak','al','am','an','ao','ap','aq','ar','as','at'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  n = Math.floor(n);
  if(n < 1e4) return String(n);
  let i = 0;
  while(n >= 1000 && i < SUF.length-1){ n /= 1000; i++; }
  // Суффиксы кончились — переходим на экспоненту, иначе получалась каша вида «7.3e+68at»
  if(n >= 1000) return n.toExponential(2).replace('e+','e') + SUF[SUF.length-1];
  return (n >= 100 ? n.toFixed(0) : n.toFixed(1)) + SUF[i];
}
function mmss(ms){
  if(ms < 0) ms = 0;
  const t = Math.ceil(ms/1000), h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
  return h > 0 ? (h+'ч '+m+'м') : (m+':'+String(s).padStart(2,'0'));
}

}
function weekKey(){
  const d = new Date(), on = new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));
  const dn = on.getUTCDay() || 7; on.setUTCDate(on.getUTCDate()+4-dn);
  const y0 = new Date(Date.UTC(on.getUTCFullYear(),0,1));
  return on.getUTCFullYear()*100 + Math.ceil(((on-y0)/86400000 + 1)/7);
}
/* «1 минуту», «2 минуты», «5 минут» — чтобы описания сами следовали
   за константой и никогда не расходились с тем, что игра реально даёт. */
function minWord(n){
  n = Math.abs(n|0);
  const t = n % 10, h = n % 100;
  if(h >= 11 && h <= 14) return 'минут';
  if(t === 1) return 'минуту';
  if(t >= 2 && t <= 4) return 'минуты';
  return 'минут';
}
const minTxt = n => n + ' ' + minWord(n);
function toast(msg){
  const box = $('#toasts');
  for(const t of box.children) if(t.textContent === msg) return;
  while(box.children.length >= 2) box.firstChild.remove();
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 1800);
}
// renderAll, а не renderHud: иначе открытая вкладка магазина показывала
// старый баланс и старые цены, пока не переключишься на поле и обратно.
/* Заработанные алмазы копим отдельно от купленных: пригласившему капает
   доля только с добычи, покупки за звёзды в неё не входят. */
function earnGems(n){
  n = Math.max(0, Math.round(n));
  S.gems += n;
  if(S.biz) S.biz.pool = (S.biz.pool|0) + n;
  return n;
}
// Экранируем имена из Telegram — они приходят с сервера и попадают в разметку
function esc(t){ return String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function addGems(n, why){
  earnGems(n);
  toast((why ? why + ': ' : '') + '+' + n + ' 💎');
  SFX.gem(); renderAll(); save();
}
function spendGems(n){
  if(S.gems < n){ noGems(n); return false; }
  S.gems -= n; renderAll(); save(); return true;
}

/* ============ ПРОИЗВОДНЫЕ ============ */
const isPremium = () => S.premiumUntil > Date.now();
// Бак растёт с уровнем игрока: +ENERGY_PER_LEVEL за каждый
// Сколько предметов выкуплено во всех трёх витринах за текущий круг
const vipCount = () => (S.vip||[]).reduce((n,a)=>n + (a ? a.length : 0), 0) + (S.vipEver|0);
const energyMax = () => Math.round((C.ENERGY_MAX + (S.level-1)*C.ENERGY_PER_LEVEL
    + vipCount()*C.VIP_ENERGY + (S.bakBonus|0)) *
  (isPremium() ? 1 + C.PREM_ENERGY_PCT : 1));
// Все доливки считаются от текущего бака, поэтому не отстают от уровня
const canEnergy     = () => Math.round(energyMax() * C.ENERGY_CAN_PCT);
const specialEnergy = () => C.SPECIAL_ENERGY;
const starterEnergy = () => Math.round(energyMax() * C.STARTER_ENERGY_PCT);
// Каждое выполненное задание добавляет 10% ко всему получаемому опыту
const xpMult = () => 1 + C.XP_PER_QUEST_BONUS * (S.questsDone|0);
/* Откат энергии зависит от размера бака: 1 в минуту на первой сотне и плюс
   ещё по одной за каждые следующие 100. На баке 400 это 4 в минуту. */
const regenPerMin = () => Math.max(1, Math.floor(energyMax() / 100) * C.REGEN_PER_100);
const regenSec  = () => 60 / regenPerMin() / (isPremium() ? C.PREM_REGEN_MULT : 1);
/* Цена доливки привязана к количеству энергии, а не к кнопке:
   ENERGY_GEMS_PER_100 алмазов за сотню, в «Пока дают» вдвое дешевле. */
const energyPrice = (amount, offer) => Math.max(1, Math.ceil(
  Math.max(0, amount) / 100 * (offer ? C.ENERGY_GEMS_OFFER : C.ENERGY_GEMS_PER_100)));
// сколько не хватает до полного бака
const energyGap = () => Math.max(0, Math.ceil(energyMax() - S.energy));
const orderSlots= () => C.ORDER_SLOTS + (isPremium() ? C.ORDER_SLOTS_PREM : 0);
const xpNeed = l => Math.round(C.XP_BASE * Math.pow(l, C.XP_POW));
// Цена предмета: экспонента по уровню, сверху множитель редкости
const price = l => Math.round(C.SELL_BASE * Math.pow(C.SELL_POW, l-1) * RAR_COIN[rarOf(l)] *
  Math.pow(C.GALAXY_COIN_MULT, galaxyOf(l)-1));
// Опыт за слияние и за заказ тоже растёт с редкостью
const mergeXp = l => Math.round(C.XP_PER_MERGE * RAR_XP[rarOf(l)] * Math.pow(C.GALAXY_XP_MULT, galaxyOf(l)-1) * xpMult());
const orderXp = l => Math.round(C.XP_PER_ORDER_LVL * Math.sqrt(l) * RAR_XP[rarOf(l)] / 2 * xpMult());
/* Минимальный сброс банкомата. Растёт от заданий, но шаг дорожает с уровнем:
   до 20-го — 2 задания, с 20-го — 3, с 40-го — 4, с 60-го — 5.
   Считаем прогоном от начала, чтобы состояние не хранить и старые сейвы
   пересчитывались сами. */
const genStepFor = lvl => (C.GEN_STEPS.find(x => lvl < x[0]) || C.GEN_STEPS[C.GEN_STEPS.length-1])[1];
function genFromQuests(done){
  let lvl = 1, left = Math.max(0, done|0), guard = 0;
  while(guard++ < 2000){
    const step = genStepFor(lvl);
    if(left < step) break;
    left -= step; lvl++;
  }
  return { lvl, left };
}
const genMin = () => clamp(genFromQuests(S.questsDone).lvl
  + Math.floor(vipCount() / C.VIP_STEP_GEN), 1, C.MAX_LVL - 2);
const questsToNextGen = () => {
  const g = genFromQuests(S.questsDone);
  return genStepFor(g.lvl) - g.left;
};
const rowsMax = () => {
  let r = C.ROWS_START;
  for(const lv of C.ROW_UNLOCK_LEVELS) if(S.level >= lv) r++;
  return Math.min(C.BOARD_ROWS, r);
};
const cellOpen = i => i < S.rows * C.BOARD_COLS;
/* ============ УНИКАЛЬНЫЕ ПРЕДМЕТЫ ============
   Некоторые уровни цепочки — не просто вещь, а штука с зарядами:
   тапаешь и получаешь пользу. Порядок в списке = приоритет, поэтому
   пересечений кратностей быть не может. */
const SPECIALS = [
  { type:'safe',     ch:1, ic:'🏦', name:'Касса',
    desc:l=>'Тап: ' + fmt(price(l)*C.SAFE_MULT) + ' монет' },
  { type:'producer', ch:3, ic:'🏭', name:'Станок',
    desc:l=>'Тап: выдаёт ' + nameOf(Math.max(1, l - C.PRODUCER_BACK)) },
  { type:'energy',   ch:2, ic:'🔌', name:'Генератор',
    desc:()=>'Тап: +' + specialEnergy() + ' энергии' },
  { type:'gems',     ch:1, ic:'💎', name:'Копилка',
    desc:()=>'Тап: +' + C.SPECIAL_GEMS + (C.SPECIAL_GEMS === 1 ? ' алмаз' : ' алмазов') },
  { type:'chest',    ch:1, ic:'📦', name:'Посылочный',
    desc:()=>'Тап: бесплатная посылка' },
];
/* Заряд теперь не привязан к виду предмета. Любая вещь с вероятностью
   SPECIAL_CHANCE приходит заряженной, тип берётся случайно из списка выше.
   Зарядов тем больше, чем выше уровень: базовые плюс один за каждые
   SPECIAL_CH_STEP уровней. Тип хранится в самом предмете (поле sp),
   поэтому две одинаковые вещи могут быть разными: одна Копилка, другая пустая. */
/* Прежнее правило: тип выводился из кратности уровня. Оставлено только для
   переноса старых сохранений — новые предметы получают тип случайно. */
function oldSpecialIdx(l){
  const by = { 25:0, 10:1, 13:2, 17:3, 23:4 };
  for(const every of [25, 10, 13, 17, 23])
    if(l >= every && l % every === 0) return by[every];
  return null;
}
function specialOf(it){
  if(!it || it.sp == null) return null;
  return SPECIALS[it.sp] || null;
}
/* Надбавка к зарядам от уровня вещи. Сначала быстро — плюс один за каждые
   SPECIAL_CH_STEP уровней, но не больше SPECIAL_CH_MAX. Этот потолок набирается
   к 50-му уровню, дальше рост замедляется: плюс один за каждые SPECIAL_CH_SLOW.
   Так на 50-м +5, на 100-м +6, на 200-м +8, на 500-м +14. */
function chargeBonus(l){
  const fast = Math.min(C.SPECIAL_CH_MAX, Math.floor(l / C.SPECIAL_CH_STEP));
  const slow = Math.max(0, Math.floor((l - C.SPECIAL_CH_MAX*C.SPECIAL_CH_STEP) / C.SPECIAL_CH_SLOW));
  return fast + slow;
}
/* Сейф Мажора. Выпадает вместо обычного предмета: занимает клетку, не сливается,
   тапом отдаёт содержимое и исчезает. Редкость решается одним броском —
   от мифической к обычной, чтобы редкая не съедала шанс частой. */
function rollVault(){
  const r = Math.random();
  let acc = 0;
  for(let i = C.VAULT_CHANCE.length - 1; i >= 0; i--){
    acc += C.VAULT_CHANCE[i];
    if(r < acc) return i;
  }
  return null;
}
// что лежит в сейфе этой редкости: тип выбирается поровну из трёх
function vaultLoot(rar){
  const kind = (Math.random() * 3) | 0;
  if(kind === 0) return { kind:'cap',    n:C.VAULT_CAP_PCT[rar] };
  if(kind === 1) return { kind:'gems',   n:C.VAULT_GEMS[rar] };
  return              { kind:'magnets', n:C.VAULT_MAGNETS[rar] };
}
// что навесить на только что созданный предмет: {sp, ch} либо пусто
function rollSpecial(l){
  if(Math.random() >= C.SPECIAL_CHANCE) return { sp:null, ch:null };
  const i = (Math.random() * SPECIALS.length) | 0;
  return { sp:i, ch: SPECIALS[i].ch + chargeBonus(l) };
}
/* Цена сброса банкомата: базовая плюс 1 за каждые TAP_COST_STEP уровней игрока.
   На 1–4 уровне — 2, на 5-м — 3, на 20-м — 6. Бак тоже растёт с уровнем,
   так что сбросов меньше не становится, но каждый весит дороже. */
function tapCost(){ return C.ENERGY_TAP_COST + Math.floor(S.level / C.TAP_COST_STEP); }


/* ============ ЛЕСТНИЦА 50 УРОВНЕЙ ИГРОКА ============ */
// Множитель награды: каждые LVL_REWARD_STEP уровней +50%, потолок ×10 (на 90-м уровне)
const rewardMult = l => Math.min(C.LVL_REWARD_CAP, 1 + C.LVL_REWARD_BONUS * Math.floor(l / C.LVL_REWARD_STEP));
function levelReward(l){
  const m = rewardMult(l);
  if(l % 10 === 0){ const n = Math.max(1, Math.round((75 + l*2) * m / C.LVL_GEM_DIV));
    return { kind:'gems', n, em:'💎', text:fmt(n) + ' алмазов' }; }
  if(l % 5 === 0){ const n = Math.round(2 * m);
    return { kind:'chest', n, em:'📦', text:n + (n === 1 ? ' посылка' : n < 5 ? ' посылки' : ' посылок') }; }
  if(l % 3 === 0) return { kind:'boost', em:'🤑', text:'Банкомат сошёл с ума' };
  const n = Math.max(1, Math.round((10 + Math.floor(l/4)*5) * m / C.LVL_GEM_DIV));
  return { kind:'gems', n, em:'💎', text:fmt(n) + ' алмазов' };
}
function giveLevelReward(l){
  const r = levelReward(l);
  if(r.kind === 'gems')  earnGems(r.n);
  if(r.kind === 'chest') S.pendingChests += r.n;
  if(r.kind === 'boost') S.drop2Until = Math.max(S.drop2Until, Date.now()) + C.BOOST_DROP2_MIN*60000;
  if(r.kind === 'row')   S.rows = rowsMax();
  return r;
}

/* ============ БИЗНЕС-СООБЩЕСТВО ============
   Приглашённые друзья. Связь «кто кого привёл» живёт ТОЛЬКО на сервере:
   в сейве её подделали бы за минуту. Клиент показывает присланный список,
   а свои цифры (уровень, очки лиги, добытые алмазы) отдаёт вместе с обычным
   пингом времени — отдельных записей в хранилище это не добавляет.

   Три слоя мотивации, чтобы работали и привлечение, и удержание:
     вехи  — разовая награда, когда друг перерастает ступень BIZ_STEPS;
     доля  — BIZ_SHARE_PCT от всего, что друг добыл, навсегда и из кармана
             игры, а не из его кармана;
     штат  — постоянные бонусы за число АКТИВНЫХ, то есть заходивших. */

function myTgId(){
  try{ return (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0; }
  catch(e){ return 0; }
}
function bizLink(){ return 'https://t.me/' + C.BIZ_BOT + '/' + C.BIZ_APP + '?startapp=r' + (myTgId() || '0'); }
function bizList(){ return (S.biz && Array.isArray(S.biz.list)) ? S.biz.list : []; }
// Настоящий друг: дорос до BIZ_MIN_LVL и провёл в игре BIZ_MIN_MIN минут.
// Ферму одноразовых аккаунтов это делает невыгодной — бот столько не наиграет.
function bizReal(f){ return (f.lvl|0) >= C.BIZ_MIN_LVL && (f.min|0) >= C.BIZ_MIN_MIN; }
// Активный: заходил за последние BIZ_ACTIVE_DAYS дней
function bizFresh(f){ return Date.now() - (f.last||0) < C.BIZ_ACTIVE_DAYS*86400000; }
function bizActive(){ let n = 0; for(const f of bizList()) if(bizReal(f) && bizFresh(f)) n++; return n; }

/* Ранг штата: последний перекрытый порог. Индекс 0 — «Одиночка». */
function bizRank(){
  const a = bizActive();
  const r = { i:0, active:a };
  for(let k=0;k<C.BIZ_RANKS.length;k++) if(a >= C.BIZ_RANKS[k][0]) r.i = k+1;
  r.name = C.BIZ_RANK_NAMES[Math.min(r.i, C.BIZ_RANK_NAMES.length-1)];
  r.nextName = C.BIZ_RANK_NAMES[Math.min(r.i+1, C.BIZ_RANK_NAMES.length-1)];
  r.next = C.BIZ_RANKS[r.i] || null;    // следующий порог или null на потолке
  return r;
}
/* Что даёт порог. Награда разовая: взял её один раз — и она остаётся,
   даже если люди потом разбегутся. */
function rankRewardText(k, short){
  const q = C.BIZ_RANKS[k], p = [];
  if(q[1]) p.push(q[1] + ' 🧲');
  if(q[2]) p.push(q[2] + ' 📦');
  if(q[3]) p.push('+' + q[3] + ' ⚡' + (short ? '' : ' к баку'));
  if(q[4]) p.push('+' + Math.round(q[4]*100) + (short ? '% 🏦' : '% к максимуму монет'));
  return p.join(' · ');
}
// Сколько порогов взято, но ещё не забрано
function bizRankPend(){ return Math.max(0, bizRank().i - (S.biz.rankTaken|0)); }
function bizClaimRank(){
  const to = bizRank().i, from = S.biz.rankTaken|0;
  if(to <= from){ toast('Пока нечего забирать'); SFX.err(); haptic('err'); return; }
  let mg = 0, ch = 0, bak = 0, cap = 1;
  for(let k=from;k<to;k++){
    const q = C.BIZ_RANKS[k];
    mg += q[1]; ch += q[2]; bak += q[3]; cap *= (1 + q[4]);
  }
  S.biz.rankTaken = to;
  if(mg)  S.magnets = (S.magnets|0) + mg;
  if(ch)  S.pendingChests = (S.pendingChests|0) + ch;
  if(bak) S.bakBonus = (S.bakBonus|0) + bak;
  const wasCap = coinCap();
  if(cap > 1) S.capMul = Math.max(1, S.capMul||1) * cap;
  SFX.level(); haptic('ok');
  openSheet('<div class="bigem">🏢</div>' +
    '<h3 class="sh-h">' + C.BIZ_RANK_NAMES[Math.min(to, C.BIZ_RANK_NAMES.length-1)] + '</h3>' +
    '<p class="sh-p">Штат вырос. Разовая награда:<br>' +
    (mg  ? '<b style="color:var(--gold)">+' + mg + ' 🧲 магнитов</b><br>' : '') +
    (ch  ? '<b style="color:var(--gold)">+' + ch + ' 📦 посылок</b><br>' : '') +
    (bak ? '<b style="color:var(--gold)">+' + bak + ' ⚡ к баку навсегда</b> · теперь ' + energyMax() + '<br>' : '') +
    (cap > 1 ? '<b style="color:var(--gold)">Максимум монет: ' + fmt(coinCap()) + '</b><br>было ' + fmt(wasCap) : '') +
    '</p><div class="sh-row"><button class="btn gr" data-act="close">В карман</button></div>');
  renderAll(); save();
}

/* ---- вехи ---- */
function bizStepsGot(f){
  if(!bizReal(f)) return 0;
  let n = 0;
  for(const st of C.BIZ_STEPS) if((f.lvl|0) >= st[0]) n++;
  return n;
}
function bizTaken(id){ return ((S.biz.taken||{})[id]|0); }
function bizPend(f){ return Math.max(0, bizStepsGot(f) - bizTaken(f.id)); }
function bizPendAll(){ let n = 0; for(const f of bizList()) n += bizPend(f); return n; }
function bizClaim(id){
  const f = bizList().find(x=>String(x.id) === String(id));
  if(!f) return;
  const from = bizTaken(f.id), to = bizStepsGot(f);
  if(to <= from){ toast('Пока нечего забирать'); SFX.err(); haptic('err'); return; }
  let gems = 0, mg = 0, prem = 0;
  for(let i=from;i<to;i++){ const st = C.BIZ_STEPS[i]; gems += st[1]; mg += st[2]; prem += st[3]; }
  S.biz.taken = S.biz.taken || {};
  S.biz.taken[f.id] = to;
  // Награда за приглашение в общий котёл добычи не идёт: иначе получилась бы
  // пирамида, где доля капает с доли.
  S.gems += gems;
  S.biz.stepGems = (S.biz.stepGems|0) + gems;
  if(mg)   S.magnets = (S.magnets|0) + mg;
  if(prem) S.premiumUntil = Math.max(S.premiumUntil, Date.now()) + prem*86400000;
  SFX.gem(); haptic('ok');
  openSheet('<div class="bigem">🤝</div>' +
    '<h3 class="sh-h">' + esc(f.n || 'Твой человек') + ' растёт</h3>' +
    '<p class="sh-p">Закрыто вех: ' + (to-from) + '.<br>' +
    '<b style="color:var(--gem)">+' + fmt(gems) + ' 💎</b>' +
    (mg ? '<br><b style="color:var(--gold)">+' + mg + ' 🧲 магнитов</b>' : '') +
    (prem ? '<br><b style="color:var(--gold)">Золотая карта на ' + prem + ' дн.</b>' : '') + '</p>' +
    '<div class="sh-row"><button class="btn gr" data-act="close">В карман</button></div>');
  if(prem) fillOrders();
  renderAll(); save();
}

function bizCatchRef(){

}

/* ---- ответ на пинг ----
   Сервер возвращает насчитанную долю и отметку «этому новичку подарок ещё
   не выдавали». Начисляем и то и другое здесь. */
function pingBack(d, pool){
  if(pool > 0) S.biz.pool = Math.max(0, (S.biz.pool|0) - pool);   // отдано — вычитаем ровно столько
  S.biz.ok = 1;
  const share = Math.max(0, Math.round(+d.share || 0));
  if(share > 0){
    S.gems += share; S.biz.got = (S.biz.got|0) + share;
    toast('Доля с сообщества: +' + fmt(share) + ' 💎'); SFX.gem();
  }
  if(d.welcome && !S.biz.welcomed){
    S.biz.welcomed = 1;
    S.gems += C.BIZ_WELCOME_GEMS;
    S.pendingChests += C.BIZ_WELCOME_CHESTS;
    SFX.gem(); haptic('ok');
    setTimeout(()=>openSheet('<div class="bigem">🎁</div>' +
      '<h3 class="sh-h">Подарок за вход по ссылке</h3>' +
      '<p class="sh-p"><b style="color:var(--gem)">' + C.BIZ_WELCOME_GEMS + ' 💎</b> и <b>' +
      C.BIZ_WELCOME_CHESTS + ' посылки</b> от того, кто тебя позвал.<br>' +
      'Теперь ты в его сообществе — и можешь собрать своё.</p>' +
      '<div class="sh-row"><button class="btn" data-act="close">Спасибо</button>' +
      '<button class="btn gold" data-act="tobiz">Моё сообщество</button></div>'), 700);
  }
  if(cur === 'biz') renderBiz();
  renderAll(); save();
}

/* ---- список сообщества ----
   Только чтение: сервер ничего не записывает, отдаёт карточки тех, кого
   этот игрок привёл. Свои цифры уходят пингом, отдельно их слать не надо. */
async function bizSync(force){
  if(PAY.mode !== 'live' || !PAY.backend) return;
  if(!force && Date.now() - (S.biz.syncAt||0) < C.BIZ_SYNC_MIN*60000) return;
  S.biz.syncAt = Date.now();
  try{
    const r = await fetch(PAY.backend + '/api/friends', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData:(tg && tg.initData) || '' })});
    const d = await r.json();
    if(!d || !d.ok) return;
    S.biz.ok = 1;
    if(Array.isArray(d.list)) S.biz.list = d.list.slice(0, C.BIZ_LIST_MAX);
    if(cur === 'biz') renderBiz();
    renderAlerts(); save();
  }catch(e){}
}

/* ---- напоминание ----
   Раз в BIZ_NUDGE_MIN минут или каждые BIZ_NUDGE_LVL уровня — что наступит
   раньше. Когда сообщество уже собрано, зовём в BIZ_NUDGE_SLOW раз реже:
   человек и так в теме, долбить его незачем. */
function tickBizNudge(){
  if(cur !== 'game') return;                        // не перебиваем другие вкладки
  if($('#veil').classList.contains('on')) return;   // окно уже открыто
  if(drag) return;                                  // не рвём перетаскивание
  const m = bizActive() >= 3 ? C.BIZ_NUDGE_SLOW : 1;
  if(!S.biz.nudgeAt){ S.biz.nudgeAt = Date.now(); S.biz.nudgeLvl = S.level; return; }
  const byTime = Date.now() - S.biz.nudgeAt >= C.BIZ_NUDGE_MIN*60000*m;
  const byLvl  = S.level - (S.biz.nudgeLvl|0) >= C.BIZ_NUDGE_LVL*m;
  if(!byTime && !byLvl) return;
  S.biz.nudgeAt = Date.now(); S.biz.nudgeLvl = S.level;
  bizNudge(); save();
}

/* ============ ЭНЕРГИЯ ============ */
function applyOffline(){
  const now = Date.now(), cap = C.ENERGY_OFFLINE_CAP_H*3600000;
  const dt = Math.min(now - (S.enTs||now), cap);
  if(dt > 0 && S.energy < energyMax()){
    const g = Math.floor(dt/(regenSec()*1000));
    if(g > 0){ S.energy = Math.min(energyMax(), S.energy+g); S.enTs = (S.enTs||now) + g*regenSec()*1000; }
  } else S.enTs = now;
  if(S.energy >= energyMax()) S.enTs = now;
}
function tickEnergy(){
  const now = Date.now();
  if(S.energy >= energyMax()){ S.enTs = now; return; }
  while(now - S.enTs >= regenSec()*1000 && S.energy < energyMax()){ S.energy++; S.enTs += regenSec()*1000; }
}
function spendEnergy(n){
  if(S.energy < n){ offerEnergy(); return false; }
  if(S.energy >= energyMax()) S.enTs = Date.now();
  S.energy -= n;
  if(S.energy <= 0 && !S.hadZeroEnergy){ S.hadZeroEnergy = true; armStarter(); }
  return true;
}

/* ============ ПОЛЕ ============ */
function firstEmpty(){ for(let i=0;i<S.rows*C.BOARD_COLS;i++) if(!S.board[i]) return i; return -1; }
function countFree(){ let n=0; for(let i=0;i<S.rows*C.BOARD_COLS;i++) if(!S.board[i]) n++; return n; }
/* Задание «заполни всё поле». Проверяем после каждого нового предмета:
   свободных клеток не осталось — цель достигнута. */
function checkFull(){ if(countFree() === 0) quest('fill', 1); }
function spawn(l, at){
  l = clamp(l, 1, C.MAX_LVL);
  const i = (at != null && !S.board[at]) ? at : firstEmpty();
  if(i < 0){ toast('Класть некуда'); return -1; }
  const vr = rollVault();
  S.board[i] = vr == null ? Object.assign({ l }, rollSpecial(l))
                          : { l, ch:null, sp:null, vault:vr };
  checkFull();
  if(l > S.seen) S.seen = l;
  return i;
}
function boardHas(l){ return S.board.some(it=>it && it.l === l); }
function removeOne(l){
  for(let i=0;i<S.board.length;i++) if(S.board[i] && S.board[i].l === l){ S.board[i] = null; return true; }
  return false;
}

/* ============ ГЕНЕРАТОР ============ */
function genRoll(){
  const lo = genMin();
  let l = rndInt(lo, lo + C.GEN_SPREAD);
  if(Math.random() < C.GEN_PLUS2_CHANCE) l++;
  return clamp(l, 1, C.MAX_LVL);
}
function genTap(){
  if(countFree() <= 0){ toast('Класть некуда'); SFX.err(); haptic('err'); return; }
  if(!spendEnergy(tapCost())){ SFX.err(); haptic('err'); return; }
  const n = (S.drop2Until > Date.now()) ? 2 : 1;
  for(let k=0;k<n;k++){
    if(countFree() <= 0) break;
    const i = spawn(genRoll());
    if(i >= 0) popCell(i);
  }
  SFX.tap(); haptic('light');
  quest('tap', 1);
  renderAll(); save();
}

/* ============ МЕРДЖ ============ */
function tryMerge(from,to,quiet){
  const a = S.board[from], b = S.board[to];
  if(!a || !b || a.l !== b.l) return false;
  // Сейф — не предмет цепочки: его не сливают, а вскрывают тапом
  if(a.vault != null || b.vault != null) return false;
  if(a.l >= C.MAX_LVL){ if(!quiet) toast('Выше некуда'); return false; }   // упираемся только в технический потолок
  const nl = a.l + 1;
  S.board[from] = null;
  S.board[to] = Object.assign({ l:nl }, rollSpecial(nl));
  if(nl > S.seen){ S.seen = nl; if(!quiet) toast('Открыл: ' + nameOf(nl)); }
  // Перевалили за сотый — начался новый виток цепочки
  if(galaxyOf(nl) > (S.galaxySeen|0)){
    S.galaxySeen = galaxyOf(nl);
    galaxySheet(S.galaxySeen);
  }
  S.xp += mergeXp(nl);
  quest('merge', 1);
  quest('reach', nl);
  if(quiet) return true;
  quest('hand', 1);                       // сюда доходят только слияния руками
  // Заряжаем магнит: только ручные слияния, иначе магнит заряжал бы сам себя
  S.mergeStreak = (S.mergeStreak|0) + 1;
  if(S.mergeStreak >= C.MAGNET_PER_MERGES){
    S.mergeStreak -= C.MAGNET_PER_MERGES;
    S.magnets = (S.magnets|0) + 1;
    toast('Магнит заряжен · всего ' + S.magnets); SFX.gem();
  }
  popCell(to); SFX.merge(rarOf(nl)); haptic('sel');
  checkLevelUp(); renderAll(); save();
  return true;
}
function popCell(i){
  requestAnimationFrame(()=>{
    const el = document.querySelector('.cell[data-i="'+i+'"] .item');
    if(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  });
}
function countMergeable(){
  const seen = new Map(); let n = 0;
  for(let i=0;i<S.rows*C.BOARD_COLS;i++){
    const it = S.board[i];
    if(!it || it.l >= C.MAX_LVL) continue;
    if(seen.has(it.l)){ seen.delete(it.l); n++; } else seen.set(it.l, i);
  }
  return n;
}
function mergeAll(){
  const charged = (S.magnets|0) > 0;   // есть заряд — работает бесплатно и без ожидания
  if(!charged && Date.now() < S.mergeAllUntil){
    toast('Магнит остывает: ' + mmss(S.mergeAllUntil-Date.now())); SFX.err(); haptic('err'); return; }
  if(countMergeable() === 0){ toast('Сливать нечего'); SFX.err(); haptic('err'); return; }
  const was = S.seen;
  let total = 0, guard = 0;
  while(guard++ < 200){
    const seen = new Map(); let did = false;
    for(let i=0;i<S.rows*C.BOARD_COLS;i++){
      const it = S.board[i];
      if(!it || it.l >= C.MAX_LVL) continue;
      if(seen.has(it.l)){ const j = seen.get(it.l); seen.delete(it.l); if(tryMerge(j,i,true)){ total++; did = true; } }
      else seen.set(it.l, i);
    }
    if(!did) break;
  }
  if(total === 0){ toast('Сливать нечего'); SFX.err(); return; }
  if(charged) S.magnets--;                                        // потратили заряд
  else S.mergeAllUntil = Date.now() + C.MERGE_ALL_CD_MIN*60000;   // без заряда — на кулдаун
  toast('Схлопнул ' + total + ' пар' + (S.seen > was ? ' · открыл: ' + nameOf(S.seen) : ''));
  SFX.cascade(total); haptic('ok');
  checkLevelUp(); renderAll(); save();
}
function findHint(){
  const seen = new Map();
  for(let i=0;i<S.rows*C.BOARD_COLS;i++){
    const it = S.board[i];
    if(!it || it.l >= C.MAX_LVL) continue;
    if(seen.has(it.l)) return [seen.get(it.l), i];
    seen.set(it.l, i);
  }
  return null;
}

/* ============ УРОВЕНЬ ИГРОКА ============ */
function checkLevelUp(){
  let up = false;
  while(S.level < C.MAX_PLAYER_LVL && S.xp >= xpNeed(S.level)){ S.xp -= xpNeed(S.level); S.level++; up = true; }
  if(S.level >= C.MAX_PLAYER_LVL) S.xp = Math.min(S.xp, xpNeed(C.MAX_PLAYER_LVL));
  if(!up) return;
  const got = [];
  while(S.lvlTaken < S.level){ S.lvlTaken++; got.push({ lvl:S.lvlTaken, r:giveLevelReward(S.lvlTaken) }); }
  // Каждый пятый уровень приносит ограниченное предложение
  for(let l=S.level-got.length+1; l<=S.level; l++)
    if(l % C.OFFER_ON_LEVEL_EVERY === 0) addOffer();
  S.rows = rowsMax();
  SFX.level(); haptic('ok');
  fillOrders();
  levelSheet(got);
}

/* ============ ЗАКАЗЫ ============ */
function makeOrder(){
  const lo = clamp(genMin() + 1, 2, C.MAX_LVL);
  /* Потолок заказа — минимальный сброс банкомата плюс ORDER_LVL_SPREAD.
     Раньше он тянулся до самого высокого виденного уровня, и на поле прилетали
     заказы на вещь, до которой домерживаться полдня. Заодно не просим того,
     чего игрок ещё не открыл: ограничиваем и увиденным. */
  const hi = clamp(Math.min(S.seen + 1, genMin() + C.ORDER_LVL_SPREAD), lo, C.MAX_LVL);
  const l = rndInt(lo, hi);
  return { l, coins:price(l)*C.ORDER_COIN_MULT, xp:orderXp(l),
           chest: Math.random() < C.ORDER_CHEST_CHANCE,
           gems: Math.random() < C.ORDER_GEM_CHANCE ? rndInt(C.ORDER_GEMS[0], C.ORDER_GEMS[1]) : 0 };
}
function fillOrders(){
  while(S.orders.length < orderSlots()) S.orders.push(makeOrder());
  if(S.orders.length > orderSlots()) S.orders.length = orderSlots();
}
function completeOrder(i){
  const o = S.orders[i];
  if(!o) return;
  if(!boardHas(o.l)){ offerRescue(i); return; }
  removeOne(o.l);
  /* Потолок кошелька растёт от самого жирного заказа. Поднимаем его ДО начисления,
     иначе монеты за этот же заказ упёрлись бы в старую планку. */
  const wasCap = coinCap();
  if(o.coins > (S.bestOrder||0)) S.bestOrder = o.coins;
  const nowCap = coinCap();
  gainCoins(o.coins); S.xp += o.xp;
  quest('coins', o.coins);
  let msg = '+' + fmt(o.coins) + ' 🪙  +' + o.xp + ' XP';
  if(o.chest){ S.pendingChests++; msg += '  +📦'; }
  if(o.gems){ earnGems(o.gems); msg += '  +' + o.gems + ' 💎'; }
  toast(msg); SFX.order(); haptic('ok');
  quest('order', 1);
  if(nowCap > wasCap){
    SFX.level(); haptic('ok');
    setTimeout(()=>openSheet('<div class="bigem">🏦</div>' +
      '<h3 class="sh-h">Максимум монет поднялся</h3>' +
      '<p class="sh-p">Сейчас: <b style="color:var(--gold)">' + fmt(nowCap) + ' 🪙</b><br>' +
      'Было ' + fmt(wasCap) + '. Потолок — ' + C.COIN_CAP_MULT + ' самых жирных заказов, ' +
      'так что сдавай дороже, и кошелёк станет глубже.</p>' +
      '<div class="sh-row"><button class="btn gr" data-act="close">Понял</button></div>'), 260);
  }
  S.orders.splice(i,1);
  if(isPremium()) fillOrders();
  else S.orderCdUntil = Date.now() + C.ORDER_REFRESH_SEC*1000;
  checkLevelUp(); renderAll(); save();
}
function tickOrders(){
  if(S.orders.length >= orderSlots()) return false;
  if(isPremium() || Date.now() >= S.orderCdUntil){ fillOrders(); return true; }
  return false;
}
function rerollOrders(){
  if(S.rerollLeft > 0) S.rerollLeft--;
  else if(!spendGems(C.REROLL_GEMS)) return;
  S.orders = []; S.orderCdUntil = 0; fillOrders();
  toast('Заказы поменялись'); SFX.order(); haptic('sel');
  renderAll(); save();
}

/* ============ ЕЖЕДНЕВНЫЕ ЗАДАНИЯ ============ */
const QUESTS = [
  { id:'merge', text:n=>'Сделай ' + n + ' слияний',        goal:()=>rndInt(25,50) },
  { id:'order', text:n=>'Сдай ' + n + ' заказов',          goal:()=>rndInt(1,3) },
  { id:'tap',   text:n=>'Тапни банкомат ' + n + ' раз',    goal:()=>rndInt(30,60) },
  /* Цель не выше сброса банкомата плюс QUEST_REACH_SPREAD: иначе задание
     просит вещь, до которой мержиться полдня. Заодно не выше увиденного. */
  { id:'reach', text:n=>'Собери ' + nameOf(n) + ' ' + emo(n),
    goal:()=>clamp(Math.min(S.seen+1, genMin() + C.QUEST_REACH_SPREAD), 4, C.MAX_LVL) },
  { id:'coins', text:n=>'Заработай ' + fmt(n) + ' монет',  goal:()=>Math.max(4000, Math.round(price(S.seen)*4)) },
  // Только слияния руками: магнит такие не засчитывает, иначе задание закрывалось бы одной кнопкой
  { id:'hand',  text:n=>'Объедини вручную ' + n + ' раз',  goal:()=>rndInt(C.QUEST_HAND[0], C.QUEST_HAND[1]) },
  { id:'fill',  text:()=>'Заполни всё поле',               goal:()=>1 },
  { id:'sell',  text:n=>'Продай ' + n + ' любых предметов', goal:()=>C.QUEST_SELL },
  { id:'vault', text:n=>'Открой ' + n + ' Сейфов Мажора 🔐', goal:()=>C.QUEST_VAULT },
];
/* ---------- ЗАДАНИЯ НА ДЕНЬ ----------
   Два задания в сутки, награда у каждого своя и выбирается случайно.
   Прогресс идёт через ту же функцию quest(), что и часовые. */
const DAILY = [
  { id:'order', text:n=>'Сдай ' + n + ' заказов',           goal:()=>C.DAILY_ORDERS },
  { id:'hand',  text:n=>'Объедини вручную ' + n + ' раз',   goal:()=>C.DAILY_HAND },
  { id:'tap',   text:n=>'Тапни банкомат ' + n + ' раз',     goal:()=>C.DAILY_TAPS },
];
const DAILY_REWARDS = [
  { k:'chest', ic:'📦', text:()=>C.DAILY_CHESTS + ' посылок' },
  { k:'gems',  ic:'💎', text:()=>C.DAILY_GEMS + ' алмазов' },
  { k:'pts',   ic:'🏆', text:()=>C.DAILY_PTS + ' очков лиги' },
  { k:'bak',   ic:'⚡', text:()=>'+' + C.DAILY_BAK + ' к баку навсегда' },
];
function rollDaily(){
  const pool = DAILY.slice(), out = [];
  for(let i=0;i<C.DAILY_COUNT && pool.length;i++){
    const q = pool.splice(rndInt(0,pool.length-1),1)[0];
    out.push({ id:q.id, goal:q.goal(), cur:0, done:false, claim:false,
               rw: rndInt(0, DAILY_REWARDS.length-1) });
  }
  return out;
}
function claimDaily(i){
  const q = S.daily[i]; if(!q || !q.claim) return;
  q.claim = false;
  const rw = DAILY_REWARDS[q.rw] || DAILY_REWARDS[0];
  let line = '';
  if(rw.k === 'chest'){ S.pendingChests += C.DAILY_CHESTS; line = '<b>' + C.DAILY_CHESTS + ' посылок</b> ждут во вкладке'; }
  if(rw.k === 'gems'){  earnGems(C.DAILY_GEMS);            line = '<b style="color:var(--gem)">+' + C.DAILY_GEMS + ' 💎</b>'; }
  if(rw.k === 'pts'){   S.ptsBank += C.DAILY_PTS;          line = '<b style="color:var(--gold)">+' + C.DAILY_PTS + ' очков лиги</b>'; }
  if(rw.k === 'bak'){   S.bakBonus = (S.bakBonus|0) + C.DAILY_BAK;
                        line = '<b style="color:var(--gold)">+' + C.DAILY_BAK + ' ⚡ к баку навсегда</b><br>Теперь бак ' + energyMax(); }
  SFX.level(); haptic('ok');
  openSheet('<div class="bigem">' + rw.ic + '</div><h3 class="sh-h">Дневное задание закрыто</h3>' +
    '<p class="sh-p">' + line + '</p>' +
    '<div class="sh-row"><button class="btn gr" data-act="close">Забрать</button></div>');
  renderAll(); save();
}
function rollQuests(){
  const pool = QUESTS.slice(), out = [];
  for(let i=0;i<C.QUEST_COUNT && pool.length;i++){
    const q = pool.splice(rndInt(0,pool.length-1),1)[0];
    out.push({ id:q.id, goal:q.goal(), cur:0, done:false, claim:false });
  }
  return out;
}
function rollDay(){
  const d = dayKey();
  if(S.day !== d){
    S.day = d;
    S.rerollLeft = C.REROLL_FREE_DAY;   // бесплатная смена заказов — раз в сутки
    S.daily = rollDaily();              // новые задания на день
    save();
  }
  if(!S.daily || !S.daily.length) S.daily = rollDaily();
  rollHour();
}
// Набор заданий живёт один час и меняется сам
function rollHour(){
  const h = hourKey();
  if(S.hour === h) return;
  S.hour = h;
  S.quests = rollQuests();
  S.questRerollLeft = C.QUEST_REROLL_FREE;
  save();
}
function quest(kind,val){
  let ch = false;
  // дневные задания считают тот же прогресс, что и часовые
  for(const q of (S.daily||[])){
    if(q.done || q.id !== kind) continue;
    q.cur += val;
    if(q.cur >= q.goal){ q.done = true; q.claim = true; ch = true; }
  }
  if(!S.quests){ if(ch){ toast('Задание выполнено!'); renderAlerts(); } return; }
  for(const q of S.quests){
    if(q.done || q.id !== kind) continue;
    if(kind === 'reach') q.cur = Math.max(q.cur, val);
    else q.cur += val;
    if(q.cur >= q.goal){ q.done = true; q.claim = true; ch = true; }
  }
  if(ch){ toast('Задание выполнено!'); renderAlerts(); }
}
function rerollQuests(){
  if(S.questRerollLeft > 0) S.questRerollLeft--;
  else if(!spendGems(C.QUEST_REROLL_GEMS)) return;
  S.quests = rollQuests();
  toast('Задания поменялись'); SFX.order();
  renderAll(); save();
}
// Награда за задание. Набранные задания поднимают сброс банкомата — шаг растёт с уровнем.
// Награда зависит от места в наборе: первое задание дешевле, третье жирнее
const questGems = i => C.QUEST_GEMS[Math.min(i, C.QUEST_GEMS.length - 1)];
function claimQuest(i){
  const q = S.quests[i];
  if(!q || !q.claim) return;
  q.claim = false;
  const wasMin = genMin();
  S.questsDone++;
  addGems(questGems(i), 'Задание');
  const nowMin = genMin();
  if(nowMin > wasMin){
    SFX.level(); haptic('ok');
    openSheet('<div class="bigem">' + emo(nowMin) + '</div>' +
      '<h3 class="sh-h">Банкомат подрос</h3>' +
      '<p class="sh-p">Теперь он сбрасывает не ниже, чем <b style="color:var(' + RAR_VAR[rarOf(nowMin)] + ')">' +
        nameOf(nowMin) + '</b> вместо ' + nameOf(wasMin) + '. Выполнено заданий: ' + S.questsDone + '.</p>' +
      '<div class="sh-row"><button class="btn gr" data-act="close">Отлично</button></div>');
  }
  renderAll(); save();
}

/* ============ НЕДЕЛЬНАЯ ВЫПЛАТА ЛИГИ ============
   Место стабильно, потому что очки дают только витрины. При смене недели
   выдаём приз за место, зафиксированное на прошлой неделе.
   Соперники считаются локально — настоящая раздача приедет с бэкендом. */
function myRank(){
  const rows = leaderboard();
  return rows.findIndex(r=>r.me);
}
function weeklyPayout(){
  const wk = weekKey();
  if(S.league.week === wk) return;
  const hadWeek = S.league.week > 0;
  const rank = S.league.rank, di = S.league.div|0;
  S.league.week = wk;
  S.league.seed = Math.floor(Math.random()*1e9);
  if(hadWeek && rank != null && rank >= 0){
    const prize = prizeFor(rank, di);
    if(prize > 0){
      earnGems(prize);
      setTimeout(()=>openSheet('<div class="bigem">🏆</div>' +
